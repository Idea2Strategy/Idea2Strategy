schema_version: 1
id: work.clone-readiness
readiness: ready
title: Make fresh clones immediately collaboration-ready
outcome: A fresh GitHub or GitLab clone initializes its local harness and passes the mandatory collaboration checks without user-specific files or manual repair.
acceptance:
    - id: acceptance.clone.initialization
      given: A contributor has a fresh develop clone
      when: They run scripts/initialize-local-harness.ps1 -Verify
      then: The local harness and non-secret product-authority reference are created without modifying tracked files
      failure: Initialization requires copied local metadata or leaves the working tree dirty
    - id: acceptance.clone.policy-verification
      given: The fresh clone has completed local harness initialization
      when: They run scripts/verify-collaboration-policy.ps1
      then: The collaboration policy verification passes
      failure: Verification fails because owner or integrity metadata is missing
    - id: acceptance.clone.remote-layouts
      given: The distributed develop branches
      when: GitHub is cloned recursively and GitLab is cloned normally
      then: GitHub has the exact UI submodule and GitLab has an ordinary monolithic UI tree
      failure: A clone has a wrong branch, missing UI, nested Git metadata, or an unexpected dirty tree
refs:
    - decision.dependencies.evidence-based
workspaces:
    - workspace.root
scope:
    repositories:
        - repository.github.root
    paths:
        - .harness/work/definitions/work.clone-readiness.yaml
        - README.md
        - docs/superpowers/plans/2026-07-22-clone-readiness.md
        - docs/superpowers/specs/2026-07-22-clone-readiness-design.md
        - scripts/initialize-local-harness.ps1
        - scripts/test-local-harness.ps1
    policy_ids: []
    scenario_ids: []
    contract_ids: []
    db_entities: []
    migration_slots: []
    ui_flows: []
    dependency_majors: []
    root_pointers: []
dependencies: []
merge_order:
    - workspace.root
first_failing_test: scripts/test-local-harness.ps1 must fail because a fresh initialization does not create the required non-secret owner reference.
evidence:
    kinds:
        - integration
        - test
        - user
    integration_required: true
    user_validation: true
    migration_required: false
    rollback_required: false
fingerprint: sha256:007e725aeded65f342f5cc4e3826f3f197fc7ea6f9b691ed80c83453323f1e7a
