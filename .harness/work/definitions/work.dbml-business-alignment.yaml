schema_version: 1
id: work.dbml-business-alignment
readiness: ready
title: Align DBML proposal with confirmed service rules
outcome: A reviewable pull request contains the isolated DBML proposal, explicit protected-canonical conflict mappings, migration and rollback requirements, and deterministic validation for the confirmed bot, trading, backtest, performance, and competition rules.
acceptance:
    - id: acceptance.dbml.business-alignment
      given: The protected product authority cannot be freshly verified and the canonical specifications conflict with confirmed service decisions.
      when: The proposal is prepared for review.
      then: Only isolated proposal and validation files change, and every protected canonical conflict is listed with its proposed replacement meaning.
      failure: Protected specs, contracts, governance, collaboration policy, or canonical db/schema.dbml are modified or the proposal is described as approved.
    - id: acceptance.dbml.validation
      given: The proposed DBML contains bot, trading, backtest, performance, and competition changes.
      when: Repository validation runs.
      then: The complete DBML parses and all focused invariant validators pass without broken references or legacy allocation names.
      failure: Any parser, invariant validator, repository-integrity check, or diff hygiene check fails.
refs:
    - capability.backtest.automatic
    - capability.bot.server-execution
    - capability.room.bot-comparison
    - policy.execution.server-only
    - policy.privacy.strategy-private
    - policy.user.no-direct-orders
    - quality.auditability
    - quality.failure-safety
    - quality.reproducibility
    - scenario.bot.evaluate
    - scenario.room.finish
    - scenario.strategy.release
workspaces:
    - workspace.root
scope:
    repositories:
        - repository.github.root
    paths:
        - package.json
        - proposals/dbml-redesign
        - scripts/validate-competition-dbml.mjs
        - scripts/validate-dbml.mjs
        - scripts/validate-trading-dbml.mjs
    policy_ids:
        - policy.execution.server-only
        - policy.privacy.strategy-private
        - policy.user.no-direct-orders
    scenario_ids:
        - scenario.bot.evaluate
        - scenario.room.finish
        - scenario.strategy.release
    contract_ids: []
    db_entities:
        - backtest.*
        - bot.bots
        - competition.*
        - performance.*
        - trading.*
    migration_slots:
        - postgresql.logical-dbml-redesign
    ui_flows:
        - ui.backtest.results
        - ui.bot.operations
        - ui.room.lifecycle
    dependency_majors: []
    root_pointers: []
dependencies: []
merge_order:
    - workspace.root
first_failing_test: scripts/validate-trading-dbml.mjs must reject legacy allocation table and FK names before the DBML rename is applied.
evidence:
    kinds:
        - competition-invariants
        - dbml-parse
        - protected-source-audit
        - repository-integrity
        - trading-invariants
    integration_required: true
    user_validation: true
    migration_required: true
    rollback_required: true
fingerprint: sha256:d2a3190aa17f3426561354779e4e98d1edd0e7455f6fbff7f64dbc85ba76e8ad
