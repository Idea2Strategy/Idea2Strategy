schema_version: 1
id: work.aws-development-foundation
readiness: ready
title: Provision the Development AWS foundation
outcome: The infrastructure owner can recreate the confirmed Development AWS environment from reviewed Terraform without creating Production resources or exposing EC2, Redis, or RDS directly to the internet.
acceptance:
    - id: acceptance.aws-development-plan
      given: An authenticated AWS Development profile and an empty account except for the default VPC.
      when: Terraform is initialized and planned from the Development root.
      then: The plan creates only the Development VPC, ALB, two EC2 roles, private RDS, three S3 boundaries, ECR, SSM, Route 53, ACM, and CloudWatch resources.
      failure: Production resources, a NAT Gateway, public SSH, public RDS, public S3, or a directly exposed application port is planned.
    - id: acceptance.no-unconfirmed-apply
      given: EC2, ALB, RDS, public IPv4, and Route 53 can incur cost or alter DNS.
      when: Static validation and terraform plan complete.
      then: The exact plan and DNS delegation step are reviewed before terraform apply.
      failure: Billable resources or authoritative DNS changes are applied without review.
    - id: acceptance.rebuildable-state
      given: Terraform state must survive compute replacement.
      when: The bootstrap root is applied.
      then: A versioned, encrypted, non-public S3 state bucket with TLS enforcement is created separately from application roles.
      failure: State or credentials are written to Git, local EC2 disks, or an application-accessible bucket.
refs:
    - quality.auditability
    - quality.failure-safety
    - quality.reproducibility
    - technology.need.object-storage
    - technology.need.server-runtime
workspaces:
    - workspace.root
scope:
    repositories:
        - idea2strategy.platform
    paths:
        - .gitignore
        - infra/**
    policy_ids: []
    scenario_ids: []
    contract_ids: []
    db_entities: []
    migration_slots: []
    ui_flows: []
    dependency_majors:
        - hashicorp/aws@6
    root_pointers: []
dependencies:
    - work.infrastructure-architecture-discovery
merge_order:
    - workspace.root
first_failing_test: Terraform is absent and no bootstrap or Development root exists, so terraform fmt, init, validate, and plan cannot succeed.
evidence:
    kinds:
        - aws-read-only-inventory
        - security-boundary-review
        - terraform-fmt-check
        - terraform-plan-review
        - terraform-validate
    integration_required: false
    user_validation: true
    migration_required: false
    rollback_required: true
fingerprint: sha256:9f36d467780fdbce2e938f5689028d4efe42f9ee7a24da244e446d738beb0c6b
