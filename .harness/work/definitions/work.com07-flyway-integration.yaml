schema_version: 1
id: work.com07-flyway-integration
readiness: ready
title: Validate central Flyway and database write ownership
outcome: A deterministic central backend Flyway bundle applies the canonical schema exactly once, owner contributions are verified globally, and application runtimes cannot execute migrations.
acceptance:
    - id: acceptance.database-access-boundary
      given: backend, trading, backtest, and pipeline database responsibilities
      when: ownership verification runs
      then: each schema has one registered write owner, owner contributions can only alter owned entities, and application roles have no DDL authority
      failure: a schema has multiple owners, an unknown owner, a contribution alters another owner's entity, or an application role receives DDL authority
    - id: acceptance.flyway-bundle-deterministic
      given: the immutable V1 baseline and exact owner contribution directories from pinned workspace commits
      when: the central migration bundle is assembled twice
      then: both manifests, ordered migration lists, and content digests are identical and every migration has a globally unique UTC timestamp version
      failure: a floating branch, duplicate version, legacy post-baseline name, unknown owner, or nondeterministic bundle is accepted
    - id: acceptance.flyway-once
      given: a clean PostgreSQL 16 database and the assembled central bundle
      when: Flyway migrates twice and validates
      then: the first run applies the complete history, the second run executes zero migrations, and validation succeeds
      failure: an application owns migration execution, migration fails, or the second run changes schema state
    - id: acceptance.runtime-no-ddl
      given: a database already migrated by the central bundle
      when: backend and trading runtimes start
      then: Flyway auto-execution is disabled, ORM remains validate-only, and jOOQ/persistence mappings fail on schema drift without creating DDL
      failure: a runtime applies migrations, creates schema objects, or silently targets absent objects
refs:
    - quality.auditability
    - quality.failure-safety
    - quality.reproducibility
workspaces:
    - workspace.backend
    - workspace.backtest-engine
    - workspace.data-pipeline
    - workspace.root
    - workspace.trading-engine
scope:
    repositories:
        - repository.github.backend
        - repository.github.root
        - repository.github.trading-engine
    paths:
        - .github/workflows/**
        - backend/db-migration/**
        - backend/modules/backend-persistence/build.gradle.kts
        - backend/modules/backend-persistence/src/test/**
        - compose.back.yml
        - scripts/**
        - trading-engine/apps/trading-worker/build.gradle.kts
        - trading-engine/apps/trading-worker/src/main/resources/application.yaml
        - trading-engine/db/migration-contributions/**
        - trading-engine/modules/trading-persistence/build.gradle.kts
        - trading-engine/modules/trading-persistence/src/test/**
    policy_ids: []
    scenario_ids: []
    contract_ids: []
    db_entities: []
    migration_slots:
        - flyway.central-integration
    ui_flows: []
    dependency_majors: []
    root_pointers:
        - workspace.backend
        - workspace.trading-engine
dependencies: []
merge_order:
    - workspace.backtest-engine
    - workspace.data-pipeline
    - workspace.backend
    - workspace.trading-engine
    - workspace.root
first_failing_test: The central migration test only sees backend classpath migrations, accepts no pinned owner contribution bundle, and the trading worker can still auto-run its private Flyway history.
evidence:
    kinds:
        - database-ownership
        - deterministic-bundle
        - flyway-postgresql
        - persistence-integration
        - runtime-no-ddl
    integration_required: true
    user_validation: false
    migration_required: true
    rollback_required: false
