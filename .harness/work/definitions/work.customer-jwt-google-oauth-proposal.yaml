schema_version: 1
id: work.customer-jwt-google-oauth-proposal
readiness: ready
title: Prepare customer JWT and Google OIDC implementation proposal
outcome: A reviewable proposal replaces opaque customer access sessions with short-lived signed access JWTs and rotating revocable refresh JWTs, makes backtest verification independent of identity schema reads, and adds disabled-by-default Google OIDC login wiring.
acceptance:
    - id: acceptance.google-oidc
      given: Google OAuth credentials are configured later
      when: A user completes a nonce-bound Google Identity Services ID-token popup
      then: The backend validates Google issuer, audience, signature, nonce, and immutable subject and never auto-links solely by email
      failure: Missing credentials break startup, the client secret reaches UI, or matching email silently links an identity
    - id: acceptance.jwt-access
      given: A verified active customer authenticates by password, a linked Google identity, or a new Google identity whose verified email is unbound
      when: Authentication succeeds
      then: The API returns a signed short-lived access JWT and rotating refresh JWT with explicit type and expiry metadata
      failure: An opaque access token is returned, an inactive account receives tokens, or signing material leaves backend runtime
    - id: acceptance.jwt-shared-verification
      given: A customer access JWT issued by backend-api
      when: backend-api or backtest-api authorizes a request
      then: Both verify issuer, audience, signature, token type, subject, issued-at, and expiry locally from configured verification material
      failure: Backtest queries identity tables, accepts an invalid claim set, or returns 500 for an invalid bearer token
    - id: acceptance.refresh-rotation
      given: A valid refresh JWT
      when: It is exchanged, logged out, reused after rotation, or invalidated by a security change
      then: Rotation revokes the previous server session secret and the access lifetime bounds delayed revocation
      failure: A rotated refresh JWT remains usable or an un-hashed server session secret is persisted
