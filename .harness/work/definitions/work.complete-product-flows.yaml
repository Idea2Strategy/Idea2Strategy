schema_version: 1
id: work.complete-product-flows
readiness: ready
title: Complete remaining customer and operator product flows
outcome: Every currently exposed customer and operator interaction is backed by truthful server data, complete command handling, explicit empty and failure states, and locally verified cross-service behavior.
acceptance:
    - id: acceptance.account-operations
      given: A customer or authorized operator
      when: They manage sessions, preferences, notifications, cases, evidence, or RBAC
      then: All available server capabilities are reachable only with the correct authority and the current UI reflects the persisted result
      failure: A one-way control, local/server divergence, or hidden write capability leaves the workflow incomplete
    - id: acceptance.bot-backtest-end-to-end
      given: An account with zero or more bots and official or custom backtests
      when: It inspects, starts, stops, extends, or reviews them
      then: Empty, loading, denied, stale, failed, and successful outcomes stay distinct and every supported command is server-backed
      failure: A blank pane, collapsed error, dead control, or fabricated value hides the actual outcome
    - id: acceptance.competition-lifecycle
      given: Public visitors and authenticated room participants or creators
      when: They discover, create, join, inspect, paginate, configure, or leave rooms
      then: Public and private requests are isolated, server catalog versions and timezone semantics are preserved, and authorization is reflected before commands
      failure: A private 401 breaks public data or the UI submits invented policy versions or shifted times
    - id: acceptance.dashboard-live-data
      given: An authenticated account with zero or more released bots and competition participations
      when: The account opens Home
      then: Server-owned dashboard aggregates render truthful loading, empty, ready, stale, and failure states without sample identities or performance
      failure: Home is unavailable in production or presents generated account performance
    - id: acceptance.strategy-end-to-end
      given: An authenticated strategy author
      when: The author copies, edits, validates, previews, and releases a strategy
      then: Each action uses the owned server document, canonical instruments and market data, immutable validation, and the created bot identity
      failure: An action edits the source, fabricates preview data, or navigates without completing the server command
    - id: acceptance.ui-quality
      given: Any supported route, locale, viewport, and network outcome
      when: The UI loads or an interaction completes
      then: Translation keys, accessible responsive states, bounded retries, and route-level code splitting preserve truthful behavior
      failure: Korean leaks into English, retries duplicate commands, state meanings collapse, or the initial bundle retains unrelated heavy routes
refs:
    - journey.backtest.review
    - journey.bot.operate
    - journey.operator.administer
    - journey.room.compare
    - journey.strategy.author
    - ui.backtest.results
