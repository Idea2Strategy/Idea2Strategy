schema_version: 1
id: work.customer-stateless-jwt
readiness: ready
title: Replace server-owned customer sessions with stateless JWT credentials
outcome: Customer authentication uses signed access and refresh JWTs without persisted per-device sessions or concurrent-session limits, while account security changes still invalidate credentials and strategy edit leases remain isolated from authentication state.
acceptance:
    - id: acceptance.account-revocation
      given: Customer JWTs exist for an account
      when: The password changes, recovery completes, a sanction is applied, the account closes, or logout-all is requested
      then: The account auth epoch advances and subsequent backend refresh or authorization rejects the old JWT claims
      failure: A security-sensitive account transition leaves old refresh JWTs usable
    - id: acceptance.compatible-rollout
      given: Backend, UI, backtest, database, and development deployment are released in dependency order
      when: The JWT claim and endpoint transition is deployed
      then: Invalid JWTs return 401, the UI refreshes after idle time, backtest verifies the new claim set locally, and the session table is dropped only after its foreign key dependency is migrated
      failure: A mixed-version deployment causes login loss, a schema failure, or an authorization bypass
    - id: acceptance.edit-lease-decoupling
      given: An authenticated customer edits a strategy
      when: The customer acquires, heartbeats, saves with, or releases an edit lease
      then: The lease is bound to the owning account and its independent secret rather than an identity session foreign key
      failure: Dropping identity.sessions breaks edit locking or lets another account use the lease
    - id: acceptance.stateless-login-refresh
      given: An active verified customer authenticates and later refreshes
      when: Password or trusted OIDC authentication succeeds and the refresh JWT is valid
      then: The backend issues short-lived access JWTs and a 30-day HttpOnly refresh JWT without inserting, reading, or rotating identity.sessions rows
      failure: Authentication depends on a persisted session, enforces a device count, or a refresh JWT survives an account security epoch change
