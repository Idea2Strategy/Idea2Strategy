schema_version: 1
id: work.a07-email-auth
readiness: ready
title: Implement email signup verification and login
outcome: A person can create a private account with an email and password, verify the email with an expiring one-time token, and receive a session only after verification while duplicate signup and failed login attempts are safely recorded.
acceptance:
    - id: acceptance.a07-login
      given: An email and password login attempt
      when: Credentials are checked
      then: Only a verified active account with the correct password receives an opaque session and every outcome is audited
      failure: An unverified, disabled, duplicate, or invalid credential receives a session or bypasses failure recording
    - id: acceptance.a07-persistence
      given: The central PostgreSQL schema and identity persistence adapters
      when: Integration tests execute signup, verification, lookup, and login
      then: JPA command writes and jOOQ query reads agree without schema generation
      failure: ORM DDL is required, jOOQ targets absent fields, or transaction boundaries leave partial identity state
    - id: acceptance.a07-signup
      given: A normalized email and policy-compliant password
      when: Signup is requested
      then: One pending account, encrypted email record, password credential, and verification request are stored atomically
      failure: A duplicate normalized email creates another account or plaintext credentials are persisted
    - id: acceptance.a07-verification
      given: A pending account with a verification request
      when: A valid unexpired token is consumed
      then: The token is consumed once and the email, login identity, and account become active atomically
      failure: An expired, already consumed, or superseded token activates the account
refs:
    - quality.auditability
    - quality.failure-safety
    - quality.reproducibility
