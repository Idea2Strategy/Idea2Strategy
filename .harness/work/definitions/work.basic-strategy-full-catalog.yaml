schema_version: 1
id: work.basic-strategy-full-catalog
readiness: ready
title: Complete the Basic strategy catalog and release workflow
outcome: Every block and package displayed by the Basic strategy editor is continuously validated, saved as incomplete or release-ready, and executable by the server-side event-driven personal bot runtime.
acceptance:
    - id: acceptance.continuous-validation
      given: an editable Basic strategy
      when: any block, group, instrument, allocation, schedule, or risk input changes
      then: validation runs against the current revision and returns field and composition errors without allowing stale responses to overwrite newer results
      failure: validation only runs on Save, misses composition errors, or displays a response for an older revision
    - id: acceptance.event-driven-execution
      given: a released READY strategy and ordered real-time market events
      when: the server-side trading runtime evaluates the strategy
      then: all catalog indicators and exit conditions use deterministic rolling state and emit deduplicated buy or sell intents only when their defined trigger occurs
      failure: evaluation depends on the browser, an unsupported catalog element reaches runtime, stale data trades, or duplicate events create duplicate intents
    - id: acceptance.full-editor-catalog
      given: the blocks and packages displayed at /strategies/new/basic
      when: a user selects, edits, saves, and later executes any supported composition
      then: the UI, backend catalog, semantic document, validator, release artifact, and trading runtime use the same versioned element codes and deterministic semantics
      failure: an editor-visible block is sample-only, silently discarded, or rejected solely because it is not RSI
    - id: acceptance.launch-gate
      given: a saved Basic strategy
      when: the most recent successful Save result is READY
      then: Personal bot launch is enabled for exactly that saved revision and is disabled again after any subsequent edit until another READY Save
      failure: an unsaved, incomplete, stale, or invalid revision can launch
    - id: acceptance.save-state
      given: any Basic strategy draft, whether valid or invalid
      when: the user presses Save
      then: saving is allowed and the persisted result is INCOMPLETE when invalid or READY when valid
      failure: Save is disabled by validity, invalid work is lost, or a stale validation result determines the state
