schema_version: 1
id: work.com-a21-batch-operator-trust-v3
readiness: ready
title: Propose durable A21 batch and operator trust contracts
outcome: Product authority can approve one exact fail-closed contract for durable batch recovery and operator authentication without changing canonical sources before review.
acceptance:
    - id: acceptance.com-a-operator-trust
      given: A request reaches an operator or admin boundary
      when: Authentication and authorization are evaluated
      then: A signed short-lived token is verified at the ALB and backend and mapped to an active operator with current MFA and RBAC evidence
      failure: A client-controlled header, opaque user session, stale MFA row, or edge-only decision grants operator authority
    - id: acceptance.com-a21-batch-durability
      given: A due domain item is discovered or retried by multiple workers
      when: A worker claims, loses, completes, retries, or quarantines the item
      then: PostgreSQL preserves one current lease owner and append-only attempt evidence while domain idempotency remains authoritative
      failure: A stale worker can commit ownership or a checkpoint can suppress an unprocessed domain item
refs:
    - journey.operator.administer
    - quality.auditability
    - quality.failure-safety
    - role.operator
workspaces:
