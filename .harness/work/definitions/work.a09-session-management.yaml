schema_version: 1
id: work.a09-session-management
readiness: ready
title: Implement server session lifecycle and concurrent access controls
outcome: Authenticated users can inspect and revoke server-owned sessions while expired, rotated, revoked, or security-stale credentials are rejected and configured concurrent-session limits are enforced atomically.
acceptance:
    - id: acceptance.a09-audit
      given: Session validation and lifecycle outcomes
      when: Success, expiry, rotation, revocation, or rejection occurs
      then: Correlated authentication events record the outcome without raw token or digest material
      failure: A security outcome is missing, duplicated, or leaks credential material
    - id: acceptance.a09-concurrency
      given: Multiple-device login is enabled with a configured active-session limit
      when: Concurrent logins and revocations race
      then: The persisted active-session count never exceeds the configured limit
      failure: A race admits more active sessions than configured
    - id: acceptance.a09-server-validation
      given: An opaque session token presented for authentication
      when: The server resolves the persisted session
      then: Digest, expiry, revocation, account auth epoch, and applicable credential version are all current before access is granted
      failure: A stale, expired, revoked, or mismatched session authenticates
    - id: acceptance.a09-session-control
      given: An authenticated account with one or more active sessions
      when: It rotates, logs out, remotely revokes, or revokes all sessions
      then: The selected credentials become unusable atomically and another account's sessions cannot be changed
      failure: An old token remains usable or cross-account revocation succeeds
