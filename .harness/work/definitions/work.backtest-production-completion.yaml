schema_version: 1
id: work.backtest-production-completion
readiness: ready
title: Complete production backtest execution
outcome: Released Basic strategies execute every published catalog element only on 30m, 1h, 4h, or 1d bars, users can cancel owned runs safely, and the production runtime is proven through the real cross-service path.
acceptance:
    - id: acceptance.catalog-parity
      given: any element published by the current Basic strategy catalog
      when: a released plan is executed by backtest and trading runtimes
      then: both runtimes apply the same deterministic parameters, rolling state, position metrics, schedule, and order semantics
      failure: an editor-visible element is ignored, rejected, recomputed with different semantics, or silently substituted
    - id: acceptance.production-readiness
      given: the exact release candidate configuration
      when: production preflight, deployment verification, failure recovery, and rollback checks run
      then: secrets, least privilege, queue and DLQ wiring, worker fencing, autoscaling, observability, backups, and rollback evidence are complete while deployment itself remains separately approved
      failure: a development-only default, disabled relay, missing alarm, mutable artifact, or unverified rollback is required for service
    - id: acceptance.real-service-flow
      given: a validated strategy release and locked data inputs
      when: the release creates an official run or the user requests a custom run
      then: PostgreSQL, Outbox, SQS intake, execution worker, object storage, result ingestion, and result UI complete without manual run injection
      failure: an integration test bypasses release, inserts the run manually, uses only mocks, or fabricates a successful result
    - id: acceptance.resolution-set
      given: a released Basic strategy or custom backtest request
      when: its immutable execution inputs are validated
      then: only 30m, 1h, 4h, and 1d resolutions are accepted and every other resolution fails closed with a stable error
      failure: 1m, 3m, 5m, 15m, 1w, an alias, or a missing resolution reaches execution
    - id: acceptance.user-cancellation
      given: an authenticated owner has a queued or running backtest
      when: cancellation is requested repeatedly or races with claim, checkpoint, or success
      then: the command is authorized and idempotent, cancellation wins before success publication, and cancelling and cancelled states are visible to the user
      failure: another account can cancel the run, duplicate requests conflict, work continues after cancellation wins, or the UI rejects the terminal state
