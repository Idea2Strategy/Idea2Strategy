schema_version: 1
id: work.market-data-bootstrap-infrastructure
readiness: ready
title: Provision the historical market-data bootstrap infrastructure
outcome: The infrastructure owner can load ten years of Alpaca historical data from a local Python process into a private Development S3 bucket and private PostgreSQL RDS through an SSM tunnel without provisioning the public service stack.
acceptance:
    - id: acceptance.market-data-bootstrap-plan
      given: The Development AWS account contains only the Terraform state bootstrap.
      when: Terraform is planned with the market_data_bootstrap phase.
      then: The plan creates the VPC, one SSM-managed batch EC2, private PostgreSQL 16 RDS, private versioned market-data S3, required IAM, SSM parameters, security groups, and basic logs and alarms.
      failure: The plan creates a service EC2, ALB, Route 53 zone, ACM certificate, results bucket, public RDS, public S3, SSH ingress, NAT Gateway, or Production resource.
    - id: acceptance.private-local-load-path
      given: The historical loader runs on a local developer machine.
      when: The operator uploads a sample Parquet object and opens an SSM remote-host port-forwarding session.
      then: Authenticated S3 access succeeds while public access remains blocked, and the private RDS endpoint is reachable only through the batch EC2 security group.
      failure: Anonymous S3 access works, RDS has a public address, or PostgreSQL accepts internet ingress.
    - id: acceptance.rebuildable-bootstrap
      given: The initial market-data load is temporary operational work.
      when: The batch EC2 is replaced or the full service phase is enabled later.
      then: S3 and RDS persist while compute can be recreated from Terraform without data stored on its local disk.
      failure: Official market data or catalog state depends on the batch EC2 root volume.
refs:
    - decision.data.hybrid
    - quality.auditability
    - quality.failure-safety
