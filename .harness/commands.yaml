schema_version: 1
workspace_id: workspace.root
commands:
  - id: command.context-audit
    kind: test
    argv: [stackcord, context, audit, --root, ., --json]
    timeout_seconds: 120
  - id: command.repository-integrity
    kind: security
    argv: [git, fsck, --no-dangling]
    timeout_seconds: 120
  - id: command.develop-ancestry
    kind: integration
    argv: [git, merge-base, --is-ancestor, origin/develop, HEAD]
    timeout_seconds: 30
  - id: command.user-validation-checkpoint
    kind: user
    argv: [git, rev-parse, --verify, HEAD]
    timeout_seconds: 30
  - id: command.foundation-repository-build
    kind: test
    argv: [node, scripts/verify-foundation-evidence.mjs, ci]
    environment: [APPDATA, LOCALAPPDATA]
    timeout_seconds: 120
  - id: command.foundation-service-smoke-test
    kind: test
    argv: [node, scripts/verify-foundation-evidence.mjs, ci]
    environment: [APPDATA, LOCALAPPDATA]
    timeout_seconds: 120
  - id: command.compose-static-validation
    kind: test
    argv: [node, scripts/verify-foundation-evidence.mjs, compose]
    timeout_seconds: 120
  - id: command.collaboration-policy-check
    kind: security
    argv: [node, scripts/verify-foundation-evidence.mjs, policy]
    timeout_seconds: 120
  - id: command.flyway-migration
    kind: migration
    argv: [node, scripts/verify-foundation-evidence.mjs, migration]
    timeout_seconds: 300
