schema_version: 1
workspace_id: workspace.root
commands:
  - id: command.context-audit
    kind: test
    argv: [stackcord, context, audit, --root, ., --json]
    timeout_seconds: 120
  - id: command.repository-integrity
    kind: security
    argv: [git, fsck, --no-dangling]
    timeout_seconds: 120
  - id: command.develop-ancestry
    kind: integration
    argv: [git, merge-base, --is-ancestor, origin/develop, HEAD]
    timeout_seconds: 30
  - id: command.user-validation-checkpoint
    kind: user
    argv: [git, rev-parse, --verify, HEAD]
    timeout_seconds: 30
  - id: command.foundation-repository-build
    kind: test
    argv: [powershell.exe, -NoProfile, -ExecutionPolicy, Bypass, -File, scripts/verify-foundation-ci.ps1]
    timeout_seconds: 120
  - id: command.foundation-service-smoke-test
    kind: test
    argv: [powershell.exe, -NoProfile, -ExecutionPolicy, Bypass, -File, scripts/verify-foundation-ci.ps1]
    timeout_seconds: 120
  - id: command.compose-static-validation
    kind: test
    argv: [powershell.exe, -NoProfile, -ExecutionPolicy, Bypass, -File, scripts/test-docker-development.ps1]
    timeout_seconds: 120
  - id: command.collaboration-policy-check
    kind: security
    argv: [powershell.exe, -NoProfile, -ExecutionPolicy, Bypass, -File, scripts/verify-collaboration-policy.ps1]
    timeout_seconds: 120
  - id: command.flyway-migration
    kind: migration
    argv: [powershell.exe, -NoProfile, -ExecutionPolicy, Bypass, -File, scripts/test-flyway-migration.ps1]
    timeout_seconds: 300
