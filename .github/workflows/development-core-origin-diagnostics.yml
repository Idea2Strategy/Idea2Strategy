name: Development Core origin diagnostics

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: Exact Development Core EC2 instance ID to inspect
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Collect secret-safe Core origin evidence through SSM
        shell: pwsh
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INSTANCE_ID -notmatch '^i-[0-9a-f]{17}$') {
            throw 'instance_id must be an exact EC2 instance ID.'
          }
          $actualAccount = aws sts get-caller-identity --query Account --output text
          if ($actualAccount -ne $env:EXPECTED_AWS_ACCOUNT_ID) {
            throw 'AWS account mismatch.'
          }

          $diagnosticScript = @'
          set -uo pipefail
          echo CORE_ORIGIN_DIAGNOSTIC_BEGIN
          echo CLOUD_INIT
          cloud-init status --long 2>&1 || true
          echo ORIGIN_UNIT
          systemctl show idea2strategy-origin-cert.service \
            --property=LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus 2>&1 || true
          echo ORIGIN_TIMER
          systemctl show idea2strategy-origin-cert.timer \
            --property=LoadState,ActiveState,SubState,Result,NextElapseUSecRealtime 2>&1 || true
          echo NGINX
          systemctl show nginx --property=LoadState,ActiveState,SubState,Result 2>&1 || true
          nginx -t 2>&1 || true
          ss -H -ltn sport = :443 2>&1 || true
          echo CERTBOT
          certbot certificates 2>&1 | tail -n 80 || true
          echo ORIGIN_JOURNAL
          journalctl -u idea2strategy-origin-cert.service --no-pager -n 120 2>&1 || true
          echo CLOUD_INIT_RELEVANT
          grep -E -i 'certbot|certificate|let.s encrypt|rate limit|nginx|idea2strategy-origin|configure-core-origin' \
            /var/log/cloud-init-output.log 2>&1 | tail -n 120 || true
          # Certbot's own log. The grep above matches apt's package chatter for the very packages it
          # looks for, so 120 matching lines can be entirely installation noise and hide the ACME
          # failure underneath it. This file carries protocol detail and domain names, not the
          # runtime secrets user-data writes, so it is safe to surface here.
          echo LETSENCRYPT
          tail -n 60 /var/log/letsencrypt/letsencrypt.log 2>&1 || true
          # The tail of user-data's own output with package installation removed, which is where a
          # failure between "packages installed" and "certificate issued" actually shows up.
          echo CLOUD_INIT_TAIL
          grep -vE '^(Get:|Selecting |Preparing to unpack|Unpacking |Setting up |Processing triggers|Suggested packages|The following)' \
            /var/log/cloud-init-output.log 2>&1 | tail -n 40 || true
          echo CORE_ORIGIN_DIAGNOSTIC_END
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($diagnosticScript))
          $parameters = @{ commands = @("printf '%s' '$encoded' | base64 -d | bash") } | ConvertTo-Json -Compress
          $parametersPath = [IO.Path]::GetTempFileName()
          try {
            [IO.File]::WriteAllText($parametersPath, $parameters, [Text.UTF8Encoding]::new($false))
            $commandId = aws ssm send-command `
              --instance-ids $env:INSTANCE_ID `
              --document-name AWS-RunShellScript `
              --comment 'Collect secret-safe Development Core origin diagnostics' `
              --parameters "file://$parametersPath" `
              --query Command.CommandId `
              --output text
          }
          finally {
            Remove-Item -LiteralPath $parametersPath -Force -ErrorAction SilentlyContinue
          }
          if ($commandId -notmatch '^[0-9a-f-]{36}$') {
            throw 'SSM did not return an exact command ID.'
          }

          $invocation = $null
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            Start-Sleep -Seconds 2
            try {
              $raw = aws ssm get-command-invocation `
                --command-id $commandId `
                --instance-id $env:INSTANCE_ID `
                --output json
              if ($LASTEXITCODE -ne 0) { continue }
              $invocation = $raw | ConvertFrom-Json
            }
            catch {
              continue
            }
            if ($invocation.Status -in @('Success', 'Failed', 'Cancelled', 'TimedOut')) { break }
          }
          if ($null -eq $invocation) { throw 'SSM diagnostic invocation was not observable.' }
          Write-Output $invocation.StandardOutputContent
          if (-not [string]::IsNullOrWhiteSpace($invocation.StandardErrorContent)) {
            Write-Output 'SSM_STDERR'
            Write-Output $invocation.StandardErrorContent
          }
          if ($invocation.Status -ne 'Success' -or
              -not $invocation.StandardOutputContent.Contains('CORE_ORIGIN_DIAGNOSTIC_END')) {
            throw "SSM diagnostic failed with status '$($invocation.Status)'."
          }
