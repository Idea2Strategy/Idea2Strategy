name: Development release candidate

on:
  workflow_dispatch:
    inputs:
      release_authorization:
        description: Type PREPARE_DEVELOPMENT_RC after the release candidate is approved for artifact publication and planning
        required: true
        type: string
      apply_reviewed_plan:
        description: Apply the exact saved plan after the second Development environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: development-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  build:
    if: github.ref == 'refs/heads/develop' && github.event.inputs.release_authorization == 'PREPARE_DEVELOPMENT_RC'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build untrusted ARM64 runtime inputs without AWS credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "rc-${{ github.sha }}-${{ github.run_attempt }}"
          $images = @(
            @{ name='admin-mcp'; context='backend'; file='backend/apps/admin-mcp/Dockerfile' },
            @{ name='backend-api'; context='backend'; file='backend/apps/backend-api/Dockerfile' },
            @{ name='backend-batch'; context='backend'; file='backend/apps/backend-batch/Dockerfile' },
            @{ name='backend-worker'; context='backend'; file='backend/apps/backend-worker/Dockerfile' },
            @{ name='backtest-api'; context='backtest-engine'; file='backtest-engine/Dockerfile' },
            @{ name='backtest-worker'; context='backtest-engine'; file='backtest-engine/Dockerfile' },
            @{ name='market-gateway'; context='trading-engine'; file='trading-engine/apps/market-gateway/Dockerfile' },
            @{ name='pipeline-worker'; context='data-pipeline'; file='data-pipeline/Dockerfile' },
            @{ name='trading-worker'; context='trading-engine'; file='trading-engine/apps/trading-worker/Dockerfile' }
          )
          foreach ($image in $images) {
            $target = "local/idea2strategy/$($image.name):$tag"
            docker buildx build --platform linux/arm64 --load --tag $target --file $image.file $image.context
            if ($LASTEXITCODE -ne 0) { throw "Image build failed: $($image.name)" }
          }
          docker save ($images | ForEach-Object { "local/idea2strategy/$($_.name):$tag" }) -o "$env:RUNNER_TEMP/runtime-images.tar"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build same-origin frontend without AWS credentials
        shell: bash
        env:
          VITE_OPERATOR_OIDC_ENABLED: 'true'
          VITE_OPERATOR_OIDC_ISSUER: ${{ vars.OPERATOR_OIDC_ISSUER }}
          VITE_OPERATOR_OIDC_AUTHORIZATION_ENDPOINT: ${{ vars.OPERATOR_OIDC_AUTHORIZATION_ENDPOINT }}
          VITE_OPERATOR_OIDC_TOKEN_ENDPOINT: ${{ vars.OPERATOR_OIDC_TOKEN_ENDPOINT }}
          VITE_OPERATOR_OIDC_END_SESSION_ENDPOINT: ${{ vars.OPERATOR_OIDC_END_SESSION_ENDPOINT }}
          VITE_OPERATOR_OIDC_CLIENT_ID: ${{ vars.OPERATOR_OIDC_CLIENT_ID }}
          VITE_OPERATOR_OIDC_AUDIENCE: ${{ vars.OPERATOR_OIDC_AUDIENCE }}
          VITE_OPERATOR_OIDC_REDIRECT_URI: ${{ vars.OPERATOR_OIDC_REDIRECT_URI }}
          VITE_OPERATOR_OIDC_POST_LOGOUT_REDIRECT_URI: ${{ vars.OPERATOR_OIDC_POST_LOGOUT_REDIRECT_URI }}
          VITE_OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER: ${{ vars.OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER }}
          VITE_OPERATOR_OIDC_SCOPES: ${{ vars.OPERATOR_OIDC_SCOPES }}
          VITE_OPERATOR_OIDC_SIGNING_ALGORITHM: ${{ vars.OPERATOR_OIDC_SIGNING_ALGORITHM }}
          VITE_OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID: ${{ vars.OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID }}
          VITE_OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID: ${{ vars.OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID }}
        run: |
          set -euo pipefail
          required=(
            VITE_OPERATOR_OIDC_ISSUER VITE_OPERATOR_OIDC_AUTHORIZATION_ENDPOINT
            VITE_OPERATOR_OIDC_TOKEN_ENDPOINT VITE_OPERATOR_OIDC_CLIENT_ID
            VITE_OPERATOR_OIDC_AUDIENCE VITE_OPERATOR_OIDC_REDIRECT_URI
            VITE_OPERATOR_OIDC_POST_LOGOUT_REDIRECT_URI VITE_OPERATOR_OIDC_SCOPES
            VITE_OPERATOR_OIDC_SIGNING_ALGORITHM VITE_OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER
            VITE_OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID
            VITE_OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then echo "OIDC build input is missing: $name" >&2; exit 1; fi
          done
          for endpoint in "$VITE_OPERATOR_OIDC_ISSUER" "$VITE_OPERATOR_OIDC_AUTHORIZATION_ENDPOINT" "$VITE_OPERATOR_OIDC_TOKEN_ENDPOINT"; do
            if [[ "$endpoint" != https://* ]]; then echo 'OIDC endpoint must use HTTPS' >&2; exit 1; fi
          done
          if [[ -n "$VITE_OPERATOR_OIDC_END_SESSION_ENDPOINT" && "$VITE_OPERATOR_OIDC_END_SESSION_ENDPOINT" != https://* ]]; then
            echo 'OIDC endpoint must use HTTPS' >&2; exit 1
          fi
          if [[ "$VITE_OPERATOR_OIDC_REDIRECT_URI" != https://*/operations/callback ]]; then
            echo 'OIDC redirect URI must use the service origin' >&2; exit 1
          fi
          service_origin="${VITE_OPERATOR_OIDC_REDIRECT_URI%/operations/callback}"
          if [[ "$VITE_OPERATOR_OIDC_POST_LOGOUT_REDIRECT_URI" != "$service_origin/operations/login" ]]; then
            echo 'OIDC redirect URI must use the service origin' >&2; exit 1
          fi
          if [[ "$VITE_OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER" != 'post_logout_redirect_uri' && "$VITE_OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER" != 'logout_uri' ]]; then
            echo 'OIDC logout redirect parameter is invalid' >&2; exit 1
          fi
          if [[ " $VITE_OPERATOR_OIDC_SCOPES " != *' openid '* ]]; then echo 'OIDC scopes must include openid' >&2; exit 1; fi
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          for permission_id in "$VITE_OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID" "$VITE_OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID"; do
            if [[ ! "$permission_id" =~ $uuid ]]; then echo 'RBAC permission ID is invalid' >&2; exit 1; fi
          done
          cd ui
          pnpm install --frozen-lockfile
          VITE_API_BASE_URL='' VITE_ADMIN_MCP_BASE_URL='' VITE_ENABLE_LOCAL_OPERATOR_HARNESS=false pnpm build

      - name: Create immutable release bundle
        id: release
        shell: pwsh
        run: |
          $releaseId = "${{ github.sha }}-${{ github.run_attempt }}"
          tar -czf "$env:RUNNER_TEMP/frontend.tgz" -C ui/dist .
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-images.tar
            ${{ runner.temp }}/frontend.tgz
          retention-days: 1
          if-no-files-found: error

  prepare-and-plan:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development-plan
    outputs:
      plan_key: ${{ steps.archive.outputs.plan_key }}
      plan_version: ${{ steps.archive.outputs.plan_version }}
      plan_sha256: ${{ steps.archive.outputs.plan_sha256 }}
      release_id: ${{ needs.build.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: development-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify exact AWS account
        shell: pwsh
        run: |
          $actual = aws sts get-caller-identity --query Account --output text
          if ($actual -ne '${{ vars.AWS_ACCOUNT_ID }}') { throw 'AWS account mismatch.' }

      - name: Verify required deployment secrets
        shell: pwsh
        run: |
          ./scripts/test-aws-deployment-prerequisites.ps1 `
            -AwsProfile '' `
            -ExpectedRegion '${{ env.AWS_REGION }}' `
            -RequireAlpacaSecrets `
            -RequireRuntimeDatabaseSecrets

      - name: Verify exact database bootstrap receipt
        shell: pwsh
        run: |
          ./scripts/verify-development-database-bootstrap-receipt.ps1 `
            -RootSha '${{ github.sha }}' `
            -ReceiptBucket 'idea2strategy-dev-${{ vars.AWS_ACCOUNT_ID }}-market-data' `
            -AwsProfile '' `
            -AwsRegion '${{ env.AWS_REGION }}'

      - name: Publish immutable ARM64 images and capture registry digests
        id: images
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          docker load --input "$env:RUNNER_TEMP/release/runtime-images.tar"
          $registry = '${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com'
          $tag = "rc-${{ github.sha }}-${{ github.run_attempt }}"
          aws ecr get-login-password | docker login --username AWS --password-stdin $registry
          $names = @('admin-mcp','backend-api','backend-batch','backend-worker','backtest-api','backtest-worker','market-gateway','pipeline-worker','trading-worker')
          $digests = @{}
          foreach ($name in $names) {
            $source = "local/idea2strategy/${name}:$tag"
            $target = "$registry/idea2strategy-dev/${name}:$tag"
            $platform = docker image inspect $source --format '{{.Os}}/{{.Architecture}}'
            if ([string]$platform -cne 'linux/arm64') { throw "Built image has unexpected platform: ${name}/$platform" }
            docker tag $source $target
            docker push $target
            if ($LASTEXITCODE -ne 0) { throw "Image publish failed: $name" }
            $digest = aws ecr describe-images --repository-name "idea2strategy-dev/$name" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text
            if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid ECR digest for $name." }
            $digests[$name] = $digest
          }
          $digests | ConvertTo-Json -Compress | Set-Content -NoNewline "$env:RUNNER_TEMP/image-digests.json"

      - name: Wait for ECR security scans
        shell: pwsh
        env:
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: '10'
        run: |
          $ErrorActionPreference = 'Stop'
          $digests = Get-Content "$env:RUNNER_TEMP/image-digests.json" -Raw | ConvertFrom-Json -AsHashtable
          $pending = @{}
          foreach ($entry in $digests.GetEnumerator()) {
            $name = [string]$entry.Key
            $repository = "idea2strategy-dev/$name"
            $imageDigest = [string]$entry.Value
            if ($imageDigest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Published image digest is invalid: $name" }
            $pending[$name] = @{ repository = $repository; digest = $imageDigest }
          }
          $deadline = [DateTime]::UtcNow.AddMinutes(10)

          while ($pending.Count -gt 0 -and [DateTime]::UtcNow -lt $deadline) {
            foreach ($name in @($pending.Keys)) {
              $repository = [string]$pending[$name].repository
              $digest = [string]$pending[$name].digest
              $scanJson = aws ecr describe-image-scan-findings `
                --repository-name $repository `
                --image-id "imageDigest=$digest" `
                --output json 2>$null
              if ($LASTEXITCODE -ne 0) { continue }

              $scan = $scanJson | ConvertFrom-Json
              $status = [string]$scan.imageScanStatus.status
              if ($status -eq 'FAILED' -or $status -eq 'UNSUPPORTED_IMAGE') {
                throw "ECR image scan rejected $name with terminal status $status."
              }
              if ($status -ne 'COMPLETE') { continue }

              $counts = $scan.imageScanFindings.findingSeverityCounts
              $critical = if ($null -eq $counts.CRITICAL) { 0 } else { [int]$counts.CRITICAL }
              $high = if ($null -eq $counts.HIGH) { 0 } else { [int]$counts.HIGH }
              if ($critical -gt 0 -or $high -gt 0) {
                throw "ECR image scan rejected ${name}: Critical=$critical High=$high."
              }
              $pending.Remove($name)
            }
            if ($pending.Count -gt 0) { Start-Sleep -Seconds 10 }
          }

          if ($pending.Count -gt 0) {
            throw "ECR image scan did not complete for: $(@($pending.Keys) -join ', ')."
          }

      - name: Publish immutable frontend prefix before planning
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bucket = "idea2strategy-dev-${{ vars.AWS_ACCOUNT_ID }}-frontend"
          $release = '${{ needs.build.outputs.release_id }}'
          $existing = aws s3api list-objects-v2 --bucket $bucket --prefix "_releases/$release/" --max-items 1 --query KeyCount --output text
          if ([int]$existing -ne 0) { throw "Frontend release prefix already exists: $release" }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/frontend" -Force | Out-Null
          tar -xzf "$env:RUNNER_TEMP/release/frontend.tgz" -C "$env:RUNNER_TEMP/frontend"
          aws s3 sync "$env:RUNNER_TEMP/frontend" "s3://$bucket/_releases/$release/" --cache-control 'public,max-age=31536000,immutable' --exclude 'index.html'
          aws s3 cp "$env:RUNNER_TEMP/frontend/index.html" "s3://$bucket/_releases/$release/index.html" --cache-control 'no-store' --content-type 'text/html'

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Materialize non-secret reviewed Terraform inputs
        shell: pwsh
        run: |
          $config = '${{ vars.TF_VARS_JSON }}' | ConvertFrom-Json -AsHashtable
          if (-not $config -or $config.ContainsKey('password') -or $config.ContainsKey('secret')) {
            throw 'TF_VARS_JSON must contain reviewed non-secret Terraform variables only.'
          }
          if (-not $config.ContainsKey('dns_delegation_verified') -or $config.dns_delegation_verified -ne $true) {
            throw 'TF_VARS_JSON must carry independently reviewed public DNS delegation evidence.'
          }
          if ([string]$config.operator_auth_issuer -cne '${{ vars.OPERATOR_OIDC_ISSUER }}' -or
              [string]$config.operator_auth_audience -cne '${{ vars.OPERATOR_OIDC_AUDIENCE }}') {
            throw 'Frontend OIDC issuer/audience must exactly match the Terraform runtime inputs.'
          }
          if ([string]$config.operator_rbac_catalog_read_permission_id -cne '${{ vars.OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID }}' -or
              [string]$config.operator_rbac_assignment_read_permission_id -cne '${{ vars.OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID }}') {
            throw 'Frontend RBAC permission IDs must exactly match the Terraform runtime inputs.'
          }
          $config.aws_profile = ''
          $config.aws_region = '${{ env.AWS_REGION }}'
          $config.expected_aws_account_id = '${{ vars.AWS_ACCOUNT_ID }}'
          $config.deployment_phase = 'full'
          $config.enable_https = $true
          $config.frontend_release_id = '${{ needs.build.outputs.release_id }}'
          $config.container_image_digests = Get-Content "$env:RUNNER_TEMP/image-digests.json" -Raw | ConvertFrom-Json -AsHashtable
          $config | ConvertTo-Json -Depth 20 | Set-Content -NoNewline infra/terraform/environments/development/release.auto.tfvars.json
          @"
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "idea2strategy/development/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          "@ | Set-Content infra/terraform/environments/development/release.backend.hcl

      - name: Create saved Terraform plan
        working-directory: infra/terraform/environments/development
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend-config=release.backend.hcl
          terraform validate
          terraform plan -parallelism=1 -out=deployment.tfplan
          terraform show -json deployment.tfplan > deployment.plan.json
          pwsh ../../../scripts/assert-development-terraform-plan-safe.ps1 -PlanJsonPath deployment.plan.json
          terraform show -no-color deployment.tfplan > deployment.plan.txt

      - name: Archive exact plan in protected state storage
        id: archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = "idea2strategy/development/release-candidates/${{ github.run_id }}/${{ github.run_attempt }}"
          $plan = 'infra/terraform/environments/development/deployment.tfplan'
          $planHash = (Get-FileHash -Algorithm SHA256 $plan).Hash.ToLowerInvariant()
          $put = aws s3api put-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key "$prefix/deployment.tfplan" --body $plan --server-side-encryption AES256 --output json | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$put.VersionId)) { throw 'Versioned saved-plan publication failed.' }
          "plan_key=$prefix/deployment.tfplan" >> $env:GITHUB_OUTPUT
          "plan_version=$($put.VersionId)" >> $env:GITHUB_OUTPUT
          "plan_sha256=$planHash" >> $env:GITHUB_OUTPUT
          "### Development plan awaiting apply approval" >> $env:GITHUB_STEP_SUMMARY
          "* Root commit: ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          "* Plan SHA-256: $planHash" >> $env:GITHUB_STEP_SUMMARY
          "* Frontend release: ${{ needs.build.outputs.release_id }}" >> $env:GITHUB_STEP_SUMMARY
          "* Apply requested: ${{ github.event.inputs.apply_reviewed_plan }}" >> $env:GITHUB_STEP_SUMMARY
          Get-Content infra/terraform/environments/development/deployment.plan.txt >> $env:GITHUB_STEP_SUMMARY

  apply-reviewed-plan:
    if: github.event.inputs.apply_reviewed_plan == 'true'
    needs: prepare-and-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Download and verify exact reviewed plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          aws s3api get-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key '${{ needs.prepare-and-plan.outputs.plan_key }}' --version-id '${{ needs.prepare-and-plan.outputs.plan_version }}' deployment.tfplan | Out-Null
          if ((Get-FileHash -Algorithm SHA256 deployment.tfplan).Hash.ToLowerInvariant() -ne '${{ needs.prepare-and-plan.outputs.plan_sha256 }}') { throw 'Saved plan hash mismatch.' }

      - name: Apply only the reviewed saved plan
        working-directory: infra/terraform/environments/development
        shell: pwsh
        run: |
          Move-Item "$env:GITHUB_WORKSPACE/deployment.tfplan" ./deployment.tfplan
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=idea2strategy/development/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          terraform apply -parallelism=1 deployment.tfplan

      - name: Roll out and verify exact Core runtime images
        shell: pwsh
        run: |
          ./scripts/deploy-development-core-runtime.ps1 `
            -AwsProfile '' `
            -AwsRegion '${{ env.AWS_REGION }}'

      - name: Verify deployed Development environment
        shell: pwsh
        run: |
          ./scripts/verify-deployed-development.ps1 -AwsProfile '' -AwsRegion '${{ env.AWS_REGION }}' -ExpectedAwsAccountId '${{ vars.AWS_ACCOUNT_ID }}'
          "Verified immutable frontend release: ${{ needs.prepare-and-plan.outputs.release_id }}" >> $env:GITHUB_STEP_SUMMARY
