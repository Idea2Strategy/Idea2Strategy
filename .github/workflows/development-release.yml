name: Development release candidate

on:
  workflow_dispatch:
    inputs:
      release_authorization:
        description: Type PREPARE_DEVELOPMENT_RC after the release candidate is approved for artifact publication and planning
        required: true
        type: string
      database_bootstrap_authorization:
        description: Type BOOTSTRAP_DEVELOPMENT_DATABASE when the exact Flyway/seed or Backtest runtime-policy artifact receipt is missing
        required: true
        default: REUSE_EXISTING_RECEIPT
        type: string
      apply_reviewed_plan:
        description: Apply the exact saved plan after the second Development environment approval
        required: true
        default: false
        type: boolean
      force_rebuild_all_images:
        description: Rebuild every runtime image instead of reusing unchanged images from the previous successful release
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: development-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  bootstrap-database:
    if: github.ref == 'refs/heads/develop' && github.event.inputs.release_authorization == 'PREPARE_DEVELOPMENT_RC' && github.event.inputs.database_bootstrap_authorization == 'BOOTSTRAP_DEVELOPMENT_DATABASE'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify exact AWS account for database bootstrap
        shell: pwsh
        run: |
          $actual = aws sts get-caller-identity --query Account --output text
          if ($actual -ne '${{ vars.AWS_ACCOUNT_ID }}') { throw 'AWS account mismatch.' }

      - name: Create and verify a missing database bootstrap receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $terraformConfig = '${{ vars.TF_VARS_JSON }}' | ConvertFrom-Json -AsHashtable
          if (-not $terraformConfig -or
              -not $terraformConfig.ContainsKey('trading_market_data_feed') -or
              [string]$terraformConfig.trading_market_data_feed -cne 'sip') {
            throw 'TF_VARS_JSON must select the paid Alpaca SIP feed before database bootstrap.'
          }
          $runtimeDatabaseName = if ($terraformConfig -and $terraformConfig.ContainsKey('runtime_database_name')) {
            [string]$terraformConfig.runtime_database_name
          } else {
            'idea2strategy_runtime'
          }
          if ($runtimeDatabaseName -notmatch '^[a-z][a-z0-9_]{2,62}$' -or
              $runtimeDatabaseName -in @('idea2strategy', 'postgres', 'rdsadmin')) {
            throw 'runtime_database_name must identify the isolated canonical runtime database.'
          }
          $receiptArguments = @{
            RootSha = '${{ github.sha }}'
            ReceiptBucket = 'idea2strategy-dev-${{ vars.AWS_ACCOUNT_ID }}-market-data'
            AwsProfile = ''
            AwsRegion = '${{ env.AWS_REGION }}'
            RuntimeDatabaseName = $runtimeDatabaseName
          }
          $receipt = ./scripts/verify-development-database-bootstrap-receipt.ps1 @receiptArguments -AllowMissingReceipt | ConvertFrom-Json
          if ($receipt.status -ne 'passed') {
            $policyRoot = 'config/development/runtime-policy'
            $scoringRoot = 'config/development/scoring'
            $policyManifest = Get-Content "$policyRoot/artifact-manifest.json" -Raw | ConvertFrom-Json
            $scoringManifest = Get-Content "$scoringRoot/artifact-manifest.json" -Raw | ConvertFrom-Json
            ./scripts/invoke-development-database-bootstrap.ps1 `
              -AwsProfile '' `
              -Region '${{ env.AWS_REGION }}' `
              -ExpectedAwsAccountId '${{ vars.AWS_ACCOUNT_ID }}' `
              -RuntimeDatabaseName $runtimeDatabaseName `
              -PolicySeedSqlPath "$policyRoot/policy-seed.sql" `
              -PolicySeedSha256 ([string]$policyManifest.artifacts.'policy-seed.sql') `
              -ScoringSeedSqlPath "$scoringRoot/scoring-template-seed.sql" `
              -ScoringSeedSha256 ([string]$scoringManifest.artifacts.'scoring-template-seed.sql') `
              -ExecutionId '${{ github.run_id }}-${{ github.run_attempt }}' `
              -ReclaimPriorExecution `
              -Execute -Confirm:$false
          }
          ./scripts/verify-development-database-bootstrap-receipt.ps1 @receiptArguments
          ./scripts/publish-development-backtest-policy-artifacts.ps1 `
            -RootSha '${{ github.sha }}' `
            -Bucket 'idea2strategy-dev-${{ vars.AWS_ACCOUNT_ID }}-market-data' `
            -AwsProfile '' `
            -AwsRegion '${{ env.AWS_REGION }}' `
            -Execute -Confirm:$false

  build:
    needs: bootstrap-database
    if: always() && (needs.bootstrap-database.result == 'success' || needs.bootstrap-database.result == 'skipped') && github.ref == 'refs/heads/develop' && github.event.inputs.release_authorization == 'PREPARE_DEVELOPMENT_RC'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build untrusted ARM64 runtime inputs without AWS credentials
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "rc-${{ github.sha }}-${{ github.run_id }}"
          $images = @(
            @{ name='admin-mcp'; service='backend'; context='backend'; file='backend/apps/admin-mcp/Dockerfile' },
            @{ name='backend-api'; service='backend'; context='backend'; file='backend/apps/backend-api/Dockerfile' },
            @{ name='backend-batch'; service='backend'; context='backend'; file='backend/apps/backend-batch/Dockerfile' },
            @{ name='backend-worker'; service='backend'; context='backend'; file='backend/apps/backend-worker/Dockerfile' },
            @{ name='backtest-api'; service='backtest-engine'; context='backtest-engine'; file='backtest-engine/Dockerfile' },
            @{ name='backtest-worker'; service='backtest-engine'; context='backtest-engine'; file='backtest-engine/Dockerfile' },
            @{ name='market-gateway'; service='trading-engine'; context='trading-engine'; file='trading-engine/apps/market-gateway/Dockerfile' },
            @{ name='pipeline-worker'; service='data-pipeline'; context='data-pipeline'; file='data-pipeline/Dockerfile' },
            @{ name='trading-worker'; service='trading-engine'; context='trading-engine'; file='trading-engine/apps/trading-worker/Dockerfile' }
          )

          $forceRebuild = '${{ github.event.inputs.force_rebuild_all_images }}' -ceq 'true'
          $previousRun = $null
          if (-not $forceRebuild) {
            try {
              $headers = @{
                Accept = 'application/vnd.github+json'
                Authorization = "Bearer $env:GITHUB_TOKEN"
                'X-GitHub-Api-Version' = '2022-11-28'
              }
              $runsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/development-release.yml/runs?branch=develop&event=workflow_dispatch&status=success&per_page=20"
              $runs = Invoke-RestMethod -Uri $runsUri -Headers $headers
              $previousRun = @($runs.workflow_runs | Where-Object { [string]$_.id -cne $env:GITHUB_RUN_ID }) | Select-Object -First 1
            }
            catch {
              Write-Warning "Unable to resolve a previous successful Development release; all runtime images will be rebuilt. $($_.Exception.Message)"
            }
          }

          $previousSha = if ($null -eq $previousRun) { '' } else { [string]$previousRun.head_sha }
          $previousReleaseTag = if ($null -eq $previousRun) { '' } else { "rc-$previousSha-$([string]$previousRun.id)" }
          function Get-Gitlink([string]$Revision, [string]$Path) {
            if ([string]::IsNullOrWhiteSpace($Revision)) { return '' }
            $entry = [string](git ls-tree $Revision -- $Path)
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($entry)) { return '' }
            $parts = $entry -split '\s+'
            if ($parts.Count -lt 3 -or $parts[0] -cne '160000') { return '' }
            return [string]$parts[2]
          }

          $builtTargets = [Collections.Generic.List[string]]::new()
          $manifestImages = [Collections.Generic.List[object]]::new()
          foreach ($image in $images) {
            $currentSource = Get-Gitlink '${{ github.sha }}' $image.service
            $previousSource = Get-Gitlink $previousSha $image.service
            $mustBuild = $forceRebuild -or
              [string]::IsNullOrWhiteSpace($previousReleaseTag) -or
              [string]::IsNullOrWhiteSpace($currentSource) -or
              $currentSource -cne $previousSource
            $target = "local/idea2strategy/$($image.name):$tag"
            if ($mustBuild) {
              $cacheScope = "development-$($image.name)-arm64"
              docker buildx build `
                --platform linux/arm64 `
                --cache-from "type=gha,scope=$cacheScope" `
                --cache-to "type=gha,mode=max,scope=$cacheScope" `
                --load --tag $target --file $image.file $image.context
              if ($LASTEXITCODE -ne 0) { throw "Image build failed: $($image.name)" }
              $builtTargets.Add($target)
            }
            else {
              Write-Output "Skipping unchanged runtime image build: $($image.name) ($currentSource)"
            }
            $manifestImages.Add([ordered]@{
              name = [string]$image.name
              service = [string]$image.service
              source_revision = $currentSource
              built = [bool]$mustBuild
              reuse_tag = if ($mustBuild) { '' } else { $previousReleaseTag }
            })
          }
          if ($builtTargets.Count -gt 0) {
            docker save --output "$env:RUNNER_TEMP/runtime-images.tar" @builtTargets
            if ($LASTEXITCODE -ne 0) { throw 'Unable to archive built runtime images.' }
          }
          else {
            tar -cf "$env:RUNNER_TEMP/runtime-images.tar" --files-from /dev/null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create the empty runtime image archive.' }
          }
          [ordered]@{
            current_release_tag = $tag
            previous_release_tag = $previousReleaseTag
            images = @($manifestImages)
          } | ConvertTo-Json -Depth 5 -Compress | Set-Content -NoNewline "$env:RUNNER_TEMP/runtime-image-manifest.json"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build same-origin frontend without AWS credentials
        shell: bash
        env:
          VITE_OPERATOR_OIDC_ENABLED: 'true'
          VITE_OPERATOR_OIDC_ISSUER: ${{ vars.OPERATOR_OIDC_ISSUER }}
          VITE_OPERATOR_OIDC_AUTHORIZATION_ENDPOINT: ${{ vars.OPERATOR_OIDC_AUTHORIZATION_ENDPOINT }}
          VITE_OPERATOR_OIDC_TOKEN_ENDPOINT: ${{ vars.OPERATOR_OIDC_TOKEN_ENDPOINT }}
          VITE_OPERATOR_OIDC_END_SESSION_ENDPOINT: ${{ vars.OPERATOR_OIDC_END_SESSION_ENDPOINT }}
          VITE_OPERATOR_OIDC_CLIENT_ID: ${{ vars.OPERATOR_OIDC_CLIENT_ID }}
          VITE_OPERATOR_OIDC_AUDIENCE: ${{ vars.OPERATOR_OIDC_AUDIENCE }}
          VITE_OPERATOR_OIDC_REDIRECT_URI: ${{ vars.OPERATOR_OIDC_REDIRECT_URI }}
          VITE_OPERATOR_OIDC_POST_LOGOUT_REDIRECT_URI: ${{ vars.OPERATOR_OIDC_POST_LOGOUT_REDIRECT_URI }}
          VITE_OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER: ${{ vars.OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER }}
          VITE_OPERATOR_OIDC_SCOPES: ${{ vars.OPERATOR_OIDC_SCOPES }}
          VITE_OPERATOR_OIDC_SIGNING_ALGORITHM: ${{ vars.OPERATOR_OIDC_SIGNING_ALGORITHM }}
          VITE_OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID: ${{ vars.OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID }}
          VITE_OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID: ${{ vars.OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          required=(
            VITE_OPERATOR_OIDC_ISSUER VITE_OPERATOR_OIDC_AUTHORIZATION_ENDPOINT
            VITE_OPERATOR_OIDC_TOKEN_ENDPOINT VITE_OPERATOR_OIDC_CLIENT_ID
            VITE_OPERATOR_OIDC_AUDIENCE VITE_OPERATOR_OIDC_REDIRECT_URI
            VITE_OPERATOR_OIDC_POST_LOGOUT_REDIRECT_URI VITE_OPERATOR_OIDC_SCOPES
            VITE_OPERATOR_OIDC_SIGNING_ALGORITHM VITE_OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER
            VITE_OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID
            VITE_OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then echo "OIDC build input is missing: $name" >&2; exit 1; fi
          done
          for endpoint in "$VITE_OPERATOR_OIDC_ISSUER" "$VITE_OPERATOR_OIDC_AUTHORIZATION_ENDPOINT" "$VITE_OPERATOR_OIDC_TOKEN_ENDPOINT"; do
            if [[ "$endpoint" != https://* ]]; then echo 'OIDC endpoint must use HTTPS' >&2; exit 1; fi
          done
          if [[ -n "$VITE_OPERATOR_OIDC_END_SESSION_ENDPOINT" && "$VITE_OPERATOR_OIDC_END_SESSION_ENDPOINT" != https://* ]]; then
            echo 'OIDC endpoint must use HTTPS' >&2; exit 1
          fi
          if [[ "$VITE_OPERATOR_OIDC_REDIRECT_URI" != https://*/operations/callback ]]; then
            echo 'OIDC redirect URI must use the service origin' >&2; exit 1
          fi
          service_origin="${VITE_OPERATOR_OIDC_REDIRECT_URI%/operations/callback}"
          if [[ "$VITE_OPERATOR_OIDC_POST_LOGOUT_REDIRECT_URI" != "$service_origin/operations/login" ]]; then
            echo 'OIDC redirect URI must use the service origin' >&2; exit 1
          fi
          if [[ "$VITE_OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER" != 'post_logout_redirect_uri' && "$VITE_OPERATOR_OIDC_LOGOUT_REDIRECT_PARAMETER" != 'logout_uri' ]]; then
            echo 'OIDC logout redirect parameter is invalid' >&2; exit 1
          fi
          if [[ " $VITE_OPERATOR_OIDC_SCOPES " != *' openid '* ]]; then echo 'OIDC scopes must include openid' >&2; exit 1; fi
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          for permission_id in "$VITE_OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID" "$VITE_OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID"; do
            if [[ ! "$permission_id" =~ $uuid ]]; then echo 'RBAC permission ID is invalid' >&2; exit 1; fi
          done
          cd ui
          pnpm install --frozen-lockfile
          VITE_API_BASE_URL='' VITE_ADMIN_MCP_BASE_URL='' VITE_ENABLE_LOCAL_OPERATOR_HARNESS=false pnpm build

      - name: Create immutable release bundle
        id: release
        shell: pwsh
        run: |
          $releaseId = "${{ github.sha }}-${{ github.run_id }}"
          tar -czf "$env:RUNNER_TEMP/frontend.tgz" -C ui/dist .
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runtime-images.tar
            ${{ runner.temp }}/runtime-image-manifest.json
            ${{ runner.temp }}/frontend.tgz
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  prepare-and-plan:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development-plan
    outputs:
      plan_key: ${{ steps.archive.outputs.plan_key }}
      plan_version: ${{ steps.archive.outputs.plan_version }}
      plan_sha256: ${{ steps.archive.outputs.plan_sha256 }}
      lambda_package_key: ${{ steps.archive.outputs.lambda_package_key }}
      lambda_package_version: ${{ steps.archive.outputs.lambda_package_version }}
      lambda_package_sha256: ${{ steps.archive.outputs.lambda_package_sha256 }}
      release_id: ${{ needs.build.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: development-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify exact AWS account
        shell: pwsh
        run: |
          $actual = aws sts get-caller-identity --query Account --output text
          if ($actual -ne '${{ vars.AWS_ACCOUNT_ID }}') { throw 'AWS account mismatch.' }

      - name: Verify required deployment secrets
        shell: pwsh
        run: |
          ./scripts/test-aws-deployment-prerequisites.ps1 `
            -AwsProfile '' `
            -ExpectedRegion '${{ env.AWS_REGION }}' `
            -RequireAlpacaSecrets `
            -RequireRuntimeDatabaseSecrets

      - name: Verify database bootstrap artifact receipt
        shell: pwsh
        run: |
          $terraformConfig = '${{ vars.TF_VARS_JSON }}' | ConvertFrom-Json -AsHashtable
          $runtimeDatabaseName = if ($terraformConfig -and $terraformConfig.ContainsKey('runtime_database_name')) { [string]$terraformConfig.runtime_database_name } else { 'idea2strategy_runtime' }
          ./scripts/verify-development-database-bootstrap-receipt.ps1 `
            -RootSha '${{ github.sha }}' `
            -ReceiptBucket 'idea2strategy-dev-${{ vars.AWS_ACCOUNT_ID }}-market-data' `
            -AwsProfile '' `
            -AwsRegion '${{ env.AWS_REGION }}' `
            -RuntimeDatabaseName $runtimeDatabaseName
          $policyReceipt = ./scripts/verify-development-backtest-policy-artifacts.ps1 `
            -Bucket 'idea2strategy-dev-${{ vars.AWS_ACCOUNT_ID }}-market-data' `
            -AwsProfile '' `
            -AwsRegion '${{ env.AWS_REGION }}' | ConvertFrom-Json
          $policyReceipt.backtest_policy_artifacts |
            ConvertTo-Json -Depth 8 |
            Set-Content -NoNewline "$env:RUNNER_TEMP/backtest-policy-artifacts.json"

      - name: Publish immutable ARM64 images and capture registry digests
        id: images
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content "$env:RUNNER_TEMP/release/runtime-image-manifest.json" -Raw | ConvertFrom-Json
          $builtImages = @($manifest.images | Where-Object { [bool]$_.built })
          if ($builtImages.Count -gt 0) {
            docker load --input "$env:RUNNER_TEMP/release/runtime-images.tar"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to load built runtime images.' }
          }
          $registry = '${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com'
          $tag = "rc-${{ github.sha }}-${{ github.run_id }}"
          aws ecr get-login-password | docker login --username AWS --password-stdin $registry
          $names = @('admin-mcp','backend-api','backend-batch','backend-worker','backtest-api','backtest-worker','market-gateway','pipeline-worker','trading-worker')
          $digests = @{}
          foreach ($name in $names) {
            $manifestImage = @($manifest.images | Where-Object { [string]$_.name -ceq $name })
            if ($manifestImage.Count -ne 1) { throw "Runtime image manifest entry is missing or duplicated: $name" }
            $manifestImage = $manifestImage[0]
            if (-not [bool]$manifestImage.built) {
              $reuseTag = [string]$manifestImage.reuse_tag
              $reuseDigest = [string](aws ecr describe-images `
                --repository-name "idea2strategy-dev/$name" `
                --image-ids "imageTag=$reuseTag" `
                --query 'imageDetails[0].imageDigest' `
                --output text 2>$null)
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($reuseDigest) -or $reuseDigest -ceq 'None') {
                throw "No reusable runtime image exists; rerun with force_rebuild_all_images enabled: $name/$reuseTag"
              }
              if ($reuseDigest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Reusable ECR digest is invalid: $name" }
              $currentDigest = [string](aws ecr describe-images `
                --repository-name "idea2strategy-dev/$name" `
                --image-ids "imageTag=$tag" `
                --query 'imageDetails[0].imageDigest' `
                --output text 2>$null)
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($currentDigest) -or $currentDigest -ceq 'None') {
                $manifestPath = "$env:RUNNER_TEMP/reuse-$name-manifest.json"
                # An image digest is the SHA-256 of the manifest's exact bytes, and ECR returns that
                # manifest pretty-printed across lines. Piping it into `Set-Content -NoNewline`
                # dropped every line separator, so put-image registered a manifest 45 bytes shorter
                # than the one being reused and the comparison below correctly rejected it. That is
                # why every release since needed force_rebuild_all_images (A91). The lines are
                # rejoined with the separator they arrived with and written without a BOM.
                $manifestLines = @(aws ecr batch-get-image `
                  --repository-name "idea2strategy-dev/$name" `
                  --image-ids "imageTag=$reuseTag" `
                  --query 'images[0].imageManifest' `
                  --output text)
                if ($LASTEXITCODE -ne 0 -or $manifestLines.Count -eq 0) {
                  throw "Unable to read the reusable ECR manifest: $name/$reuseTag"
                }
                [IO.File]::WriteAllText($manifestPath, ($manifestLines -join "`n"), [Text.UTF8Encoding]::new($false))
                if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
                  throw "Unable to stage the reusable ECR manifest: $name/$reuseTag"
                }
                aws ecr put-image `
                  --repository-name "idea2strategy-dev/$name" `
                  --image-tag $tag `
                  --image-manifest "file://$manifestPath" | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "Unable to publish the reused immutable ECR tag: $name/$tag" }
                $currentDigest = [string](aws ecr describe-images `
                  --repository-name "idea2strategy-dev/$name" `
                  --image-ids "imageTag=$tag" `
                  --query 'imageDetails[0].imageDigest' `
                  --output text)
              }
              if ($currentDigest -cne $reuseDigest) {
                # Both digests, because one of them alone never said which side moved.
                throw "Server-side reuse digest mismatch: $name/$tag published $currentDigest for a manifest whose source tag $reuseTag is $reuseDigest"
              }
              Write-Output "Reusing unchanged runtime image: $name@$currentDigest"
              $digests[$name] = $currentDigest
              continue
            }
            $source = "local/idea2strategy/${name}:$tag"
            $target = "$registry/idea2strategy-dev/${name}:$tag"
            $platform = docker image inspect $source --format '{{.Os}}/{{.Architecture}}'
            if ([string]$platform -cne 'linux/arm64') { throw "Built image has unexpected platform: ${name}/$platform" }
            $sourceImageId = [string](docker image inspect $source --format '{{.Id}}')
            if ($LASTEXITCODE -ne 0 -or $sourceImageId -notmatch '^sha256:[0-9a-f]{64}$') {
              throw "Unable to fingerprint the built image: $name"
            }
            docker tag $source $target
            $digest = [string](aws ecr list-images `
              --repository-name "idea2strategy-dev/$name" `
              --filter tagStatus=TAGGED `
              --query "imageIds[?imageTag=='$tag'].imageDigest | [0]" `
              --output text)
            if ($LASTEXITCODE -ne 0) { throw "Unable to inspect the immutable ECR tag: $name" }
            if ([string]::IsNullOrWhiteSpace($digest) -or $digest -ceq 'None') {
              docker push $target
              if ($LASTEXITCODE -ne 0) { throw "Image publish failed: $name" }
              $digest = [string](aws ecr describe-images --repository-name "idea2strategy-dev/$name" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
            }
            else {
              if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Existing ECR digest is invalid: $name" }
              docker pull --platform linux/arm64 $target | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Unable to verify the existing immutable ECR image: $name" }
              $existingImageId = [string](docker image inspect $target --format '{{.Id}}')
              if ($LASTEXITCODE -ne 0 -or $existingImageId -cne $sourceImageId) {
                throw "Immutable ECR image fingerprint collision: $name"
              }
              Write-Output "Reusing verified immutable ECR image: $name@$digest"
            }
            if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid ECR digest for $name." }
            $digests[$name] = $digest
          }
          $digests | ConvertTo-Json -Compress | Set-Content -NoNewline "$env:RUNNER_TEMP/image-digests.json"

      - name: Wait for ECR security scans
        shell: pwsh
        env:
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: '10'
        run: |
          $ErrorActionPreference = 'Stop'
          $digests = Get-Content "$env:RUNNER_TEMP/image-digests.json" -Raw | ConvertFrom-Json -AsHashtable
          $pending = @{}
          foreach ($entry in $digests.GetEnumerator()) {
            $name = [string]$entry.Key
            $repository = "idea2strategy-dev/$name"
            $imageDigest = [string]$entry.Value
            if ($imageDigest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Published image digest is invalid: $name" }
            $pending[$name] = @{ repository = $repository; digest = $imageDigest }
          }
          $deadline = [DateTime]::UtcNow.AddMinutes(10)

          while ($pending.Count -gt 0 -and [DateTime]::UtcNow -lt $deadline) {
            foreach ($name in @($pending.Keys)) {
              $repository = [string]$pending[$name].repository
              $digest = [string]$pending[$name].digest
              $scanJson = aws ecr describe-image-scan-findings `
                --repository-name $repository `
                --image-id "imageDigest=$digest" `
                --output json 2>$null
              if ($LASTEXITCODE -ne 0) { continue }

              $scan = $scanJson | ConvertFrom-Json
              $status = [string]$scan.imageScanStatus.status
              if ($status -eq 'FAILED' -or $status -eq 'UNSUPPORTED_IMAGE') {
                throw "ECR image scan rejected $name with terminal status $status."
              }
              if ($status -ne 'COMPLETE') { continue }

              $counts = $scan.imageScanFindings.findingSeverityCounts
              $critical = if ($null -eq $counts.CRITICAL) { 0 } else { [int]$counts.CRITICAL }
              $high = if ($null -eq $counts.HIGH) { 0 } else { [int]$counts.HIGH }
              if ($critical -gt 0) {
                throw "ECR image scan rejected ${name}: Critical=$critical High=$high."
              }
              if ($high -gt 0) {
                Write-Warning "ECR image scan found High findings for ${name}: High=$high. High findings do not block the Development release."
              }
              $pending.Remove($name)
            }
            if ($pending.Count -gt 0) { Start-Sleep -Seconds 10 }
          }

          if ($pending.Count -gt 0) {
            Write-Warning "ECR image scan did not complete for: $(@($pending.Keys) -join ', '). Incomplete scans do not block the Development release."
          }

      - name: Publish immutable frontend prefix before planning
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bucket = "idea2strategy-dev-${{ vars.AWS_ACCOUNT_ID }}-frontend"
          $release = '${{ needs.build.outputs.release_id }}'
          New-Item -ItemType Directory "$env:RUNNER_TEMP/frontend" -Force | Out-Null
          tar -xzf "$env:RUNNER_TEMP/release/frontend.tgz" -C "$env:RUNNER_TEMP/frontend"

          $frontendRoot = (Resolve-Path "$env:RUNNER_TEMP/frontend").Path
          $fingerprintLines = @(Get-ChildItem -LiteralPath $frontendRoot -Recurse -File | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($frontendRoot, $_.FullName).Replace('\', '/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$relative`t$hash"
          } | Sort-Object -CaseSensitive)
          if ($fingerprintLines.Count -eq 0 -or -not (Test-Path -LiteralPath "$frontendRoot/index.html" -PathType Leaf)) {
            throw 'Frontend release bundle is incomplete.'
          }
          $fingerprintMaterial = ($fingerprintLines -join "`n") + "`n"
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $contentFingerprint = ([BitConverter]::ToString($sha256.ComputeHash([Text.Encoding]::UTF8.GetBytes($fingerprintMaterial)))).Replace('-', '').ToLowerInvariant()
          } finally {
            $sha256.Dispose()
          }
          $releaseMarkerKey = "_releases/$release/.release-content.sha256"
          $markerPath = "$env:RUNNER_TEMP/frontend-release.sha256"
          [IO.File]::WriteAllText($markerPath, "$contentFingerprint`n", [Text.UTF8Encoding]::new($false))

          $markerListingJson = @(aws s3api list-objects-v2 --bucket $bucket --prefix $releaseMarkerKey --max-keys 1 --output json)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the immutable frontend completion marker.' }
          $markerListing = ($markerListingJson -join "`n") | ConvertFrom-Json
          $markerExists = $null -ne $markerListing.PSObject.Properties['Contents'] -and
            @($markerListing.Contents | Where-Object { [string]$_.Key -ceq $releaseMarkerKey }).Count -eq 1
          if ($markerExists) {
            $existingMarkerPath = "$env:RUNNER_TEMP/existing-frontend-release.sha256"
            aws s3api get-object --bucket $bucket --key $releaseMarkerKey $existingMarkerPath | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read the immutable frontend completion marker.' }
            $existingFingerprint = (Get-Content -LiteralPath $existingMarkerPath -Raw).Trim()
            if ($existingFingerprint -cne $contentFingerprint) {
              throw "Frontend release content fingerprint collision: $release"
            }
            Write-Output "Reusing verified immutable frontend release: $release"
            return
          }

          aws s3 sync "$frontendRoot" "s3://$bucket/_releases/$release/" --delete --cache-control 'public,max-age=31536000,immutable' --exclude 'index.html' --exclude '.release-content.sha256'
          if ($LASTEXITCODE -ne 0) { throw 'Frontend asset sync failed.' }
          aws s3 cp "$env:RUNNER_TEMP/frontend/index.html" "s3://$bucket/_releases/$release/index.html" --cache-control 'no-store' --content-type 'text/html'
          if ($LASTEXITCODE -ne 0) { throw 'Frontend index publication failed.' }
          aws s3 cp $markerPath "s3://$bucket/$releaseMarkerKey" --cache-control 'no-store' --content-type 'text/plain'
          if ($LASTEXITCODE -ne 0) { throw 'Frontend completion marker publication failed.' }

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Materialize non-secret reviewed Terraform inputs
        shell: pwsh
        run: |
          $config = '${{ vars.TF_VARS_JSON }}' | ConvertFrom-Json -AsHashtable
          if (-not $config -or $config.ContainsKey('password') -or $config.ContainsKey('secret')) {
            throw 'TF_VARS_JSON must contain reviewed non-secret Terraform variables only.'
          }
          if ($config.ContainsKey('trading_market_data_feed') -and [string]$config.trading_market_data_feed -cne 'sip') {
            throw 'The Development release supports only the paid Alpaca SIP feed.'
          }
          $runtimeDatabaseName = if ($config.ContainsKey('runtime_database_name')) { [string]$config.runtime_database_name } else { 'idea2strategy_runtime' }
          $databaseReceipt = ./scripts/verify-development-database-bootstrap-receipt.ps1 `
            -RootSha '${{ github.sha }}' `
            -ReceiptBucket 'idea2strategy-dev-${{ vars.AWS_ACCOUNT_ID }}-market-data' `
            -AwsProfile '' `
            -AwsRegion '${{ env.AWS_REGION }}' `
            -RuntimeDatabaseName $runtimeDatabaseName | ConvertFrom-Json
          if ($databaseReceipt.status -cne 'passed' -or [int]$databaseReceipt.instrument_count -lt 500) {
            throw 'Database bootstrap did not publish a deployment-sized Trading instrument mapping.'
          }
          if (-not $config.ContainsKey('trading_runtime_artifacts') -or
              -not $config.trading_runtime_artifacts.ContainsKey('warmup-manifest')) {
            throw 'TF_VARS_JSON must retain the reviewed Trading warmup manifest.'
          }
          $runtimeArtifacts = $databaseReceipt.trading_runtime_artifacts | ConvertTo-Json -Depth 8 | ConvertFrom-Json -AsHashtable
          $config.trading_runtime_artifacts['instrument-mapping'] = $runtimeArtifacts['instrument-mapping']
          $config.trading_runtime_artifacts['provider-rights'] = $runtimeArtifacts['provider-rights']
          $config.backtest_policy_artifacts = Get-Content "$env:RUNNER_TEMP/backtest-policy-artifacts.json" -Raw | ConvertFrom-Json -AsHashtable
          $config.trading_market_data_feed = 'sip'
          if (-not $config.ContainsKey('dns_delegation_verified') -or $config.dns_delegation_verified -ne $true) {
            throw 'TF_VARS_JSON must carry independently reviewed public DNS delegation evidence.'
          }
          if ([string]$config.operator_auth_issuer -cne '${{ vars.OPERATOR_OIDC_ISSUER }}' -or
              [string]$config.operator_auth_audience -cne '${{ vars.OPERATOR_OIDC_AUDIENCE }}') {
            throw 'Frontend OIDC issuer/audience must exactly match the Terraform runtime inputs.'
          }
          if ([string]$config.operator_rbac_catalog_read_permission_id -cne '${{ vars.OPERATOR_RBAC_CATALOG_READ_PERMISSION_ID }}' -or
              [string]$config.operator_rbac_assignment_read_permission_id -cne '${{ vars.OPERATOR_RBAC_ASSIGNMENT_READ_PERMISSION_ID }}') {
            throw 'Frontend RBAC permission IDs must exactly match the Terraform runtime inputs.'
          }
          if ([string]$config.google_oauth_client_id -cne '${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}') {
            throw 'Frontend Google OAuth client ID must exactly match the Terraform runtime input.'
          }
          $config.aws_profile = ''
          $config.aws_region = '${{ env.AWS_REGION }}'
          $config.expected_aws_account_id = '${{ vars.AWS_ACCOUNT_ID }}'
          $config.deployment_phase = 'full'
          $config.enable_https = $true
          $config.frontend_release_id = '${{ needs.build.outputs.release_id }}'
          $config.container_image_digests = Get-Content "$env:RUNNER_TEMP/image-digests.json" -Raw | ConvertFrom-Json -AsHashtable
          $config | ConvertTo-Json -Depth 20 | Set-Content -NoNewline infra/terraform/environments/development/release.auto.tfvars.json
          @"
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "idea2strategy/development/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          "@ | Set-Content infra/terraform/environments/development/release.backend.hcl

      - name: Create saved Terraform plan
        working-directory: infra/terraform/environments/development
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend-config=release.backend.hcl
          terraform validate
          terraform plan -out=deployment.tfplan
          terraform show -json deployment.tfplan > deployment.plan.json
          pwsh "$GITHUB_WORKSPACE/scripts/assert-development-terraform-plan-safe.ps1" \
            -PlanJsonPath deployment.plan.json \
            -AllowedReplacementAddresses \
              'aws_ecs_task_definition.pipeline[0];aws_instance.service[0];aws_instance.trading[0];aws_secretsmanager_secret_version.core_internal[0];aws_secretsmanager_secret_version.backtest_internal[0]'
          terraform show -no-color deployment.tfplan > deployment.plan.txt

      - name: Archive exact plan in protected state storage
        id: archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = "idea2strategy/development/release-candidates/${{ github.run_id }}/${{ github.run_attempt }}"
          $plan = 'infra/terraform/environments/development/deployment.tfplan'
          $lambdaPackage = 'infra/terraform/environments/development/.terraform/operator-pre-token.zip'
          if (-not (Test-Path -LiteralPath $lambdaPackage -PathType Leaf)) { throw 'Terraform did not materialize the operator pre-token Lambda package.' }
          $planHash = (Get-FileHash -Algorithm SHA256 $plan).Hash.ToLowerInvariant()
          $lambdaPackageHash = (Get-FileHash -Algorithm SHA256 $lambdaPackage).Hash.ToLowerInvariant()
          $put = aws s3api put-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key "$prefix/deployment.tfplan" --body $plan --server-side-encryption AES256 --output json | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$put.VersionId)) { throw 'Versioned saved-plan publication failed.' }
          $lambdaPut = aws s3api put-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key "$prefix/operator-pre-token.zip" --body $lambdaPackage --server-side-encryption AES256 --output json | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$lambdaPut.VersionId)) { throw 'Versioned Lambda package publication failed.' }
          "plan_key=$prefix/deployment.tfplan" >> $env:GITHUB_OUTPUT
          "plan_version=$($put.VersionId)" >> $env:GITHUB_OUTPUT
          "plan_sha256=$planHash" >> $env:GITHUB_OUTPUT
          "lambda_package_key=$prefix/operator-pre-token.zip" >> $env:GITHUB_OUTPUT
          "lambda_package_version=$($lambdaPut.VersionId)" >> $env:GITHUB_OUTPUT
          "lambda_package_sha256=$lambdaPackageHash" >> $env:GITHUB_OUTPUT
          "### Development plan awaiting apply approval" >> $env:GITHUB_STEP_SUMMARY
          "* Root commit: ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
          "* Plan SHA-256: $planHash" >> $env:GITHUB_STEP_SUMMARY
          "* Lambda package SHA-256: $lambdaPackageHash" >> $env:GITHUB_STEP_SUMMARY
          "* Frontend release: ${{ needs.build.outputs.release_id }}" >> $env:GITHUB_STEP_SUMMARY
          "* Apply requested: ${{ github.event.inputs.apply_reviewed_plan }}" >> $env:GITHUB_STEP_SUMMARY
          Get-Content infra/terraform/environments/development/deployment.plan.txt >> $env:GITHUB_STEP_SUMMARY

  apply-reviewed-plan:
    if: always() && needs.prepare-and-plan.result == 'success' && github.event.inputs.apply_reviewed_plan == 'true'
    needs: prepare-and-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Download and verify exact reviewed plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          aws s3api get-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key '${{ needs.prepare-and-plan.outputs.plan_key }}' --version-id '${{ needs.prepare-and-plan.outputs.plan_version }}' deployment.tfplan | Out-Null
          if ((Get-FileHash -Algorithm SHA256 deployment.tfplan).Hash.ToLowerInvariant() -ne '${{ needs.prepare-and-plan.outputs.plan_sha256 }}') { throw 'Saved plan hash mismatch.' }
          aws s3api get-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key '${{ needs.prepare-and-plan.outputs.lambda_package_key }}' --version-id '${{ needs.prepare-and-plan.outputs.lambda_package_version }}' operator-pre-token.zip | Out-Null
          if ((Get-FileHash -Algorithm SHA256 operator-pre-token.zip).Hash.ToLowerInvariant() -ne '${{ needs.prepare-and-plan.outputs.lambda_package_sha256 }}') { throw 'Lambda package hash mismatch.' }

      - name: Apply only the reviewed saved plan
        working-directory: infra/terraform/environments/development
        shell: pwsh
        run: |
          Move-Item "$env:GITHUB_WORKSPACE/deployment.tfplan" ./deployment.tfplan
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=idea2strategy/development/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          Move-Item "$env:GITHUB_WORKSPACE/operator-pre-token.zip" ./.terraform/operator-pre-token.zip
          terraform apply deployment.tfplan

      - name: Roll out and verify exact Core runtime images
        shell: pwsh
        run: |
          ./scripts/deploy-development-core-runtime.ps1 `
            -AwsProfile '' `
            -AwsRegion '${{ env.AWS_REGION }}'

      - name: Roll out and verify exact Trading runtime images
        shell: pwsh
        run: |
          ./scripts/deploy-development-core-runtime.ps1 `
            -AwsProfile '' `
            -AwsRegion '${{ env.AWS_REGION }}' `
            -RuntimeRole trading

      # The backtest worker was missing from this list, so a release published its image to ECR and
      # updated SSM without the running worker ever picking it up. That is how backtest-engine
      # d0d6392 sat unused for two releases (root #454). The role is desired-zero, so the script
      # passes without acting when the group is empty; it only fails when an instance is running and
      # ends up on a digest other than the one this release published.
      - name: Roll out and verify exact Backtest worker runtime images
        shell: pwsh
        run: |
          ./scripts/deploy-development-core-runtime.ps1 `
            -AwsProfile '' `
            -AwsRegion '${{ env.AWS_REGION }}' `
            -RuntimeRole backtest-worker

      - name: Verify deployed Development environment
        shell: pwsh
        run: |
          ./scripts/verify-deployed-development.ps1 -AwsProfile '' -AwsRegion '${{ env.AWS_REGION }}' -ExpectedAwsAccountId '${{ vars.AWS_ACCOUNT_ID }}'
          "Verified immutable frontend release: ${{ needs.prepare-and-plan.outputs.release_id }}" >> $env:GITHUB_STEP_SUMMARY
