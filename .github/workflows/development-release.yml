name: Development release candidate

on:
  workflow_dispatch:
    inputs:
      release_authorization:
        description: Type PREPARE_DEVELOPMENT_RC after the release candidate is approved for artifact publication and planning
        required: true
        type: string
      apply_reviewed_plan:
        description: Apply the exact saved plan after the second Development environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: development-release
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  prepare-and-plan:
    if: github.event.inputs.release_authorization == 'PREPARE_DEVELOPMENT_RC'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: development
    outputs:
      plan_key: ${{ steps.archive.outputs.plan_key }}
      plan_version: ${{ steps.archive.outputs.plan_version }}
      plan_sha256: ${{ steps.archive.outputs.plan_sha256 }}
      frontend_key: ${{ steps.archive.outputs.frontend_key }}
      frontend_version: ${{ steps.archive.outputs.frontend_version }}
      frontend_sha256: ${{ steps.archive.outputs.frontend_sha256 }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify exact AWS account
        shell: pwsh
        run: |
          $actual = aws sts get-caller-identity --query Account --output text
          if ($actual -ne '${{ vars.AWS_ACCOUNT_ID }}') { throw 'AWS account mismatch.' }

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to ECR
        shell: bash
        run: |
          set -euo pipefail
          registry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"

      - name: Build and publish immutable ARM64 runtime images
        id: images
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $registry = '${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com'
          $tag = "rc-${{ github.sha }}-${{ github.run_attempt }}"
          $images = @(
            @{ name='admin-mcp'; context='backend'; file='backend/apps/admin-mcp/Dockerfile' },
            @{ name='backend-api'; context='backend'; file='backend/apps/backend-api/Dockerfile' },
            @{ name='backend-batch'; context='backend'; file='backend/apps/backend-batch/Dockerfile' },
            @{ name='backend-worker'; context='backend'; file='backend/apps/backend-worker/Dockerfile' },
            @{ name='backtest-api'; context='backtest-engine'; file='backtest-engine/Dockerfile' },
            @{ name='backtest-worker'; context='backtest-engine'; file='backtest-engine/Dockerfile' },
            @{ name='market-gateway'; context='trading-engine'; file='trading-engine/apps/market-gateway/Dockerfile' },
            @{ name='pipeline-worker'; context='data-pipeline'; file='data-pipeline/Dockerfile' },
            @{ name='trading-worker'; context='trading-engine'; file='trading-engine/apps/trading-worker/Dockerfile' }
          )
          $digests = @{}
          foreach ($image in $images) {
            $target = "$registry/idea2strategy-development/$($image.name):$tag"
            $metadata = Join-Path $env:RUNNER_TEMP "$($image.name)-metadata.json"
            docker buildx build --platform linux/arm64 --provenance=true --sbom=true --push --metadata-file $metadata --file $image.file $image.context
            if ($LASTEXITCODE -ne 0) { throw "Image build failed: $($image.name)" }
            $digest = (Get-Content $metadata -Raw | ConvertFrom-Json).'containerimage.digest'
            if ($digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Invalid digest for $($image.name)." }
            $digests[$image.name] = $digest
          }
          $digests | ConvertTo-Json -Compress | Set-Content -NoNewline "$env:RUNNER_TEMP/image-digests.json"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Build same-origin frontend
        shell: bash
        run: |
          set -euo pipefail
          cd ui
          pnpm install --frozen-lockfile
          VITE_API_BASE_URL='' VITE_ADMIN_MCP_BASE_URL='' VITE_ENABLE_LOCAL_OPERATOR_HARNESS=false pnpm build

      - name: Create immutable frontend archive
        id: release
        shell: pwsh
        run: |
          $releaseId = "${{ github.sha }}-${{ github.run_attempt }}"
          tar -czf "$env:RUNNER_TEMP/frontend.tgz" -C ui/dist .
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Materialize non-secret reviewed Terraform inputs
        shell: pwsh
        run: |
          $config = '${{ vars.TF_VARS_JSON }}' | ConvertFrom-Json -AsHashtable
          if (-not $config -or $config.ContainsKey('password') -or $config.ContainsKey('secret')) {
            throw 'TF_VARS_JSON must contain reviewed non-secret Terraform variables only.'
          }
          $config.aws_profile = ''
          $config.aws_region = '${{ env.AWS_REGION }}'
          $config.expected_aws_account_id = '${{ vars.AWS_ACCOUNT_ID }}'
          $config.deployment_phase = 'full'
          $config.enable_https = $true
          $config.frontend_release_id = '${{ steps.release.outputs.release_id }}'
          $config.container_image_digests = Get-Content "$env:RUNNER_TEMP/image-digests.json" -Raw | ConvertFrom-Json -AsHashtable
          $config | ConvertTo-Json -Depth 20 | Set-Content -NoNewline infra/terraform/environments/development/release.auto.tfvars.json
          @"
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "idea2strategy/development/terraform.tfstate"
          region       = "${{ env.AWS_REGION }}"
          use_lockfile = true
          encrypt      = true
          "@ | Set-Content infra/terraform/environments/development/release.backend.hcl

      - name: Create saved Terraform plan
        working-directory: infra/terraform/environments/development
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend-config=release.backend.hcl
          terraform validate
          terraform plan -parallelism=1 -out=deployment.tfplan
          terraform show -no-color deployment.tfplan > deployment.plan.txt

      - name: Archive exact plan and frontend release in protected state storage
        id: archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = "idea2strategy/development/release-candidates/${{ github.run_id }}/${{ github.run_attempt }}"
          $plan = 'infra/terraform/environments/development/deployment.tfplan'
          $frontend = "$env:RUNNER_TEMP/frontend.tgz"
          $planHash = (Get-FileHash -Algorithm SHA256 $plan).Hash.ToLowerInvariant()
          $frontendHash = (Get-FileHash -Algorithm SHA256 $frontend).Hash.ToLowerInvariant()
          $planPut = aws s3api put-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key "$prefix/deployment.tfplan" --body $plan --server-side-encryption AES256 --output json | ConvertFrom-Json
          $frontendPut = aws s3api put-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key "$prefix/frontend.tgz" --body $frontend --server-side-encryption AES256 --output json | ConvertFrom-Json
          "plan_key=$prefix/deployment.tfplan" >> $env:GITHUB_OUTPUT
          "plan_version=$($planPut.VersionId)" >> $env:GITHUB_OUTPUT
          "plan_sha256=$planHash" >> $env:GITHUB_OUTPUT
          "frontend_key=$prefix/frontend.tgz" >> $env:GITHUB_OUTPUT
          "frontend_version=$($frontendPut.VersionId)" >> $env:GITHUB_OUTPUT
          "frontend_sha256=$frontendHash" >> $env:GITHUB_OUTPUT
          "### Development plan awaiting review" >> $env:GITHUB_STEP_SUMMARY
          "* Root commit: `${{ github.sha }}`" >> $env:GITHUB_STEP_SUMMARY
          "* Plan SHA-256: `$planHash`" >> $env:GITHUB_STEP_SUMMARY
          "* Frontend SHA-256: `$frontendHash`" >> $env:GITHUB_STEP_SUMMARY
          "* Apply requested: `${{ github.event.inputs.apply_reviewed_plan }}`" >> $env:GITHUB_STEP_SUMMARY
          Get-Content infra/terraform/environments/development/deployment.plan.txt >> $env:GITHUB_STEP_SUMMARY

  apply-reviewed-plan:
    if: github.event.inputs.apply_reviewed_plan == 'true'
    needs: prepare-and-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Download and verify exact reviewed artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          aws s3api get-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key '${{ needs.prepare-and-plan.outputs.plan_key }}' --version-id '${{ needs.prepare-and-plan.outputs.plan_version }}' deployment.tfplan | Out-Null
          aws s3api get-object --bucket '${{ vars.TF_STATE_BUCKET }}' --key '${{ needs.prepare-and-plan.outputs.frontend_key }}' --version-id '${{ needs.prepare-and-plan.outputs.frontend_version }}' frontend.tgz | Out-Null
          if ((Get-FileHash -Algorithm SHA256 deployment.tfplan).Hash.ToLowerInvariant() -ne '${{ needs.prepare-and-plan.outputs.plan_sha256 }}') { throw 'Saved plan hash mismatch.' }
          if ((Get-FileHash -Algorithm SHA256 frontend.tgz).Hash.ToLowerInvariant() -ne '${{ needs.prepare-and-plan.outputs.frontend_sha256 }}') { throw 'Frontend artifact hash mismatch.' }

      - name: Apply only the reviewed saved plan
        working-directory: infra/terraform/environments/development
        shell: pwsh
        run: |
          Move-Item "$env:GITHUB_WORKSPACE/deployment.tfplan" ./deployment.tfplan
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=idea2strategy/development/terraform.tfstate" -backend-config="region=${{ env.AWS_REGION }}" -backend-config="use_lockfile=true" -backend-config="encrypt=true"
          terraform apply -parallelism=1 deployment.tfplan
          $bucket = terraform output -raw frontend_bucket
          $distribution = terraform output -raw cloudfront_distribution_id
          "FRONTEND_BUCKET=$bucket" >> $env:GITHUB_ENV
          "CLOUDFRONT_DISTRIBUTION=$distribution" >> $env:GITHUB_ENV

      - name: Publish immutable frontend and atomically promote it
        shell: pwsh
        run: |
          New-Item -ItemType Directory frontend -Force | Out-Null
          tar -xzf frontend.tgz -C frontend
          $release = '${{ needs.prepare-and-plan.outputs.release_id }}'
          aws s3 sync frontend "s3://$env:FRONTEND_BUCKET/_releases/$release/" --delete --cache-control 'public,max-age=31536000,immutable' --exclude 'index.html'
          aws s3 cp frontend/index.html "s3://$env:FRONTEND_BUCKET/_releases/$release/index.html" --cache-control 'no-store' --content-type 'text/html'
          aws s3 sync "s3://$env:FRONTEND_BUCKET/_releases/$release/" "s3://$env:FRONTEND_BUCKET/" --delete --exclude '_releases/*'
          aws cloudfront create-invalidation --distribution-id $env:CLOUDFRONT_DISTRIBUTION --paths '/*' | Out-Null
          "Frontend release promoted: $release" >> $env:GITHUB_STEP_SUMMARY
