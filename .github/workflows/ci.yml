name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: root-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Validate Terraform without AWS credentials or remote backend
        shell: pwsh
        run: ./scripts/test-terraform-readiness.ps1
      - uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.58.1
      - name: Lint Terraform
        run: |
          tflint --chdir=infra/terraform/bootstrap
          tflint --chdir=infra/terraform/environments/development
      - name: Scan Terraform policy and security
        run: |
          python -m pip install --disable-pip-version-check checkov==3.2.471
          checkov --directory infra/terraform --config-file infra/terraform/checkov.yaml
      - name: Validate secret-safe deployment inputs and Compose model
        shell: pwsh
        run: ./scripts/test-deployment-inputs.ps1

  schema-and-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install schema tooling
        run: pnpm install --frozen-lockfile
      - name: Validate canonical DBML
        run: pnpm dbml:validate
      - name: Validate canonical COM A contracts
        run: pnpm dbml:validate:com-a-canonical
      - name: Validate A12 account lifecycle contract
        run: pnpm dbml:validate:a12
      - name: Test dbdiagram export preparation
        run: pnpm dbml:export:test
      - name: Validate tracked formatting
        run: git diff --check HEAD^
      - name: Verify submodule pointers are tracked
        shell: bash
        run: |
          set -euo pipefail
          for path in backend backtest-engine data-pipeline trading-engine ui; do
            test "$(git ls-files -s "$path" | awk '{print $1}')" = "160000"
          done
      # The governance verifiers assert the product-authority list as literals in
      # four scripts and four rule documents. Without these steps a change to
      # .harness/governance.yaml can silently drift from its enforcement files.
      # initialize-local-harness.ps1 generates the ignored owner.yaml and the
      # policy integrity baseline from the checked-out tree, so a fresh runner
      # has everything the verifiers need.
      - name: Initialize local harness
        shell: pwsh
        run: ./scripts/initialize-local-harness.ps1 -Verify
      - name: Verify collaboration policy and product authorities
        shell: pwsh
        run: ./scripts/verify-collaboration-policy.ps1
      - name: Verify governance foundation evidence
        run: node scripts/verify-foundation-evidence.mjs policy
      - name: Test local harness
        shell: pwsh
        run: ./scripts/test-local-harness.ps1

  flyway-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Verify pinned central Flyway migration lifecycle
        shell: pwsh
        run: ./scripts/test-flyway-ci-bundle.ps1
