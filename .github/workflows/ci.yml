name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: root-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Validate Terraform without AWS credentials or remote backend
        shell: pwsh
        run: ./scripts/test-terraform-readiness.ps1
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.58.1
      - name: Lint Terraform
        run: |
          tflint --chdir=infra/terraform/bootstrap
          tflint --chdir=infra/terraform/environments/development
      - name: Scan Terraform policy and security
        run: |
          python -m pip install --disable-pip-version-check checkov==3.2.471
          checkov --directory infra/terraform --config-file infra/terraform/checkov.yaml
      - name: Validate secret-safe deployment inputs and Compose model
        shell: pwsh
        run: ./scripts/test-deployment-inputs.ps1
      - name: Validate manual Development release safety boundaries
        shell: pwsh
        run: ./scripts/test-development-release-workflow.ps1
      - name: Validate fast Development CI scheduling
        shell: pwsh
        run: ./scripts/test-ci-scheduling.ps1
      - name: Validate immutable GitHub Action runtime pins
        shell: pwsh
        run: ./scripts/test-github-action-runtime-pins.ps1
      - name: Validate Development transactional email infrastructure
        shell: pwsh
        run: ./scripts/test-development-email-delivery-infrastructure.ps1
      - name: Validate staged Development www edge cutover
        shell: pwsh
        run: ./scripts/test-development-www-edge.ps1
      - name: Validate pre-DNS host-ready deployment phase
        shell: pwsh
        run: ./scripts/test-development-host-ready-phase.ps1
      - name: Validate internal operator authentication boundaries
        run: node --test scripts/validate-internal-operator-auth.test.mjs
      - name: Validate local secret-scanner commit gate
        run: node --test scripts/test-secret-scan-git-hook.mjs
      - name: Validate one-shot Development database bootstrap boundaries
        shell: pwsh
        run: ./scripts/test-development-database-bootstrap.ps1
      - name: Validate proposed Development scoring seed boundary
        run: node --test scripts/validate-development-scoring-seed.test.mjs
      - name: Parse the one-shot host bootstrap
        shell: bash
        run: bash -n scripts/aws/development-database-bootstrap.sh
      - name: Validate one-shot Development market catalog bootstrap boundaries
        shell: pwsh
        run: ./scripts/test-development-market-catalog-bootstrap.ps1
      - name: Validate Development active-feed watermark wiring
        shell: pwsh
        run: ./scripts/test-development-pipeline-watermarks.ps1
      - name: Parse the market catalog host bootstrap
        shell: bash
        run: bash -n scripts/aws/development-market-catalog-bootstrap.sh

  schema-and-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install schema tooling
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate canonical DBML
        run: pnpm dbml:validate
      - name: Validate canonical COM A contracts
        run: pnpm dbml:validate:com-a-canonical
      - name: Validate release adoption contracts and registry
        run: pnpm contract:validate:release-adoption
      - name: Validate every registered contract exhaustively
        run: pnpm contract:validate:registry
      - name: Validate complete Basic strategy conformance corpus
        run: pnpm contract:validate:basic-strategy
      - name: Validate A12 account lifecycle contract
        run: pnpm dbml:validate:a12
      - name: Test dbdiagram export preparation
        run: pnpm dbml:export:test
      - name: Validate tracked formatting
        run: git diff --check HEAD^
      - name: Verify submodule pointers are tracked
        shell: bash
        run: |
          set -euo pipefail
          for path in backend backtest-engine data-pipeline trading-engine ui; do
            test "$(git ls-files -s "$path" | awk '{print $1}')" = "160000"
          done
  flyway-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
      - name: Verify pinned central Flyway migration lifecycle
        shell: pwsh
        run: ./scripts/test-flyway-ci-bundle.ps1
      - name: Verify proposed scoring seed replay and collision safety
        shell: pwsh
        run: ./scripts/test-development-scoring-seed-integration.ps1

  three-lane-feature-e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backtest-engine/pyproject.toml
      - name: Verify contract fixture parity between owners and consumers
        run: python scripts/validate_d_contract_parity.py
      - name: Install the exact backtest runtime and integration dependencies
        run: python -m pip install --disable-pip-version-check -e './backtest-engine[test]'
      - name: Prove BASIC, CUSTOM and COMPETITION on one shared runtime
        run: >-
          python -m pytest -c backtest-engine/pyproject.toml
          scripts/integration/test_three_lane_feature_e2e.py
          scripts/integration/test_basic_strategy_matrix_e2e.py -m docker -vv
