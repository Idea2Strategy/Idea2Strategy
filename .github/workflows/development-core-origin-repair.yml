name: Development Core origin repair

# Re-runs the origin configuration on a Core host that is already serving.
#
# user-data configures the origin only after the runtime service reports started. When an image
# pull is slow enough that the unit trips its start timeout, the script aborts there — the
# containers keep coming up and stay healthy, but nginx never gets its origin site and no
# certificate is installed, so every route answers 504 from the edge while the application behind
# it is fine.
#
# Replacing the instance to fix that costs a full release and rolls the dice on the same timeout.
# /usr/local/sbin/configure-core-origin is written before the failure point and is the same script
# the renewal timer runs, so running it once puts the origin back without touching anything else.

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: Exact Development Core EC2 instance ID to repair
        required: true
        type: string
      repair_authorization:
        description: Type REPAIR_DEVELOPMENT_CORE_ORIGIN to confirm this host is serving and only its origin is missing
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    if: github.event.inputs.repair_authorization == 'REPAIR_DEVELOPMENT_CORE_ORIGIN'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Re-run the origin configuration through SSM
        shell: pwsh
        env:
          INSTANCE_ID: ${{ inputs.instance_id }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:INSTANCE_ID -notmatch '^i-[0-9a-f]{17}$') {
            throw 'instance_id must be an exact EC2 instance ID.'
          }
          $actualAccount = aws sts get-caller-identity --query Account --output text
          if ($actualAccount -ne $env:EXPECTED_AWS_ACCOUNT_ID) {
            throw 'AWS account mismatch.'
          }

          # Refuses to run where the origin is already configured, so a repair cannot be used as a
          # way to reissue a certificate on a healthy host. The readiness assertions afterwards are
          # the same ones the release gate makes, so a repair that "succeeds" means the same thing.
          $repairScript = @'
          set -euo pipefail
          echo CORE_ORIGIN_REPAIR_BEGIN
          test -x /usr/local/sbin/configure-core-origin
          if test -s /etc/nginx/conf.d/idea2strategy-origin.conf; then
            echo ORIGIN_ALREADY_CONFIGURED
            exit 1
          fi
          /usr/local/sbin/configure-core-origin
          systemctl daemon-reload
          systemctl start idea2strategy-origin-cert.service || true
          systemctl enable --now idea2strategy-origin-cert.timer || true
          test -s /etc/nginx/conf.d/idea2strategy-origin.conf
          systemctl is-active --quiet nginx
          nginx -t
          ss -H -ltn sport = :443 | grep -q LISTEN
          echo CORE_ORIGIN_REPAIRED
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($repairScript))
          $parameters = @{ commands = @("printf '%s' '$encoded' | base64 -d | bash") } | ConvertTo-Json -Compress
          $parametersPath = [IO.Path]::GetTempFileName()
          try {
            [IO.File]::WriteAllText($parametersPath, $parameters, [Text.UTF8Encoding]::new($false))
            $commandId = aws ssm send-command `
              --instance-ids $env:INSTANCE_ID `
              --document-name AWS-RunShellScript `
              --comment 'Repair the Development Core origin configuration' `
              --timeout-seconds 600 `
              --parameters "file://$parametersPath" `
              --query Command.CommandId `
              --output text
          }
          finally {
            Remove-Item -LiteralPath $parametersPath -Force -ErrorAction SilentlyContinue
          }
          if ($commandId -notmatch '^[0-9a-f-]{36}$') {
            throw 'SSM did not return an exact command ID.'
          }

          $invocation = $null
          for ($attempt = 0; $attempt -lt 180; $attempt++) {
            Start-Sleep -Seconds 5
            try {
              $raw = aws ssm get-command-invocation `
                --command-id $commandId `
                --instance-id $env:INSTANCE_ID `
                --output json
              if ($LASTEXITCODE -ne 0) { continue }
              $invocation = $raw | ConvertFrom-Json
            }
            catch {
              continue
            }
            if ($invocation.Status -in @('Success', 'Failed', 'Cancelled', 'TimedOut')) { break }
          }
          if ($null -eq $invocation) { throw 'SSM repair invocation was not observable.' }
          Write-Output $invocation.StandardOutputContent
          if (-not [string]::IsNullOrWhiteSpace($invocation.StandardErrorContent)) {
            Write-Output $invocation.StandardErrorContent
          }
          if ($invocation.Status -cne 'Success' -or
              -not ([string]$invocation.StandardOutputContent).Contains('CORE_ORIGIN_REPAIRED')) {
            throw "Origin repair did not complete: $($invocation.Status)."
          }
