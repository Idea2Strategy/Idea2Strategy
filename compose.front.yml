name: ${COMPOSE_PROJECT_NAME:-idea2strategy-local}

services:
  frontend:
    container_name: idea2strategy-frontend
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Polling stats run on libuv's threadpool (default 4 threads). On the
      # Windows bind mount each stat is slow, the pollers monopolize the pool,
      # and every real file read - index.html, /public assets, any
      # not-yet-cached module - queues behind them for ~15s per request
      # (measured; healthchecks also timed out, so the container sat
      # "unhealthy"). A bigger pool plus a 5s poll interval brings first byte
      # to <200ms while HMR still sees Windows-side edits within 5s.
      UV_THREADPOOL_SIZE: "64"
      CHOKIDAR_INTERVAL: "5000"
      # The entrypoint's pnpm install runs with no TTY. Without CI=true a stale
      # node_modules volume aborts the install with
      # ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY and the container restart-loops
      # after every lockfile change (root #266).
      CI: "true"
      # Same-origin by default: backend-api sends no CORS headers, so a browser
      # pointed at a cross-origin VITE_API_BASE_URL cannot complete any API call
      # (root #266). The vite dev server proxies /api and /actuator to
      # backend-api over the compose network instead - the same posture the
      # real-API browser E2E uses in CI.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
      VITE_REAL_API_TARGET: ${VITE_REAL_API_TARGET:-http://backend-api:8080}
      # The backtest read surface lives on backtest-api, not backend-api; the
      # vite proxy sends only /api/v1/backtests there (ui fix/frontend-honest-surfaces).
      VITE_BACKTEST_API_TARGET: ${VITE_BACKTEST_API_TARGET:-http://backtest-api:8082}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-15173}:5173"
    volumes:
      - ./ui:/workspace/ui
      - frontend-node-modules:/workspace/ui/node_modules
    networks:
      - development
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

networks:
  development:
    name: idea2strategy-development

volumes:
  frontend-node-modules:
    name: idea2strategy-frontend-node-modules
