name: ${COMPOSE_PROJECT_NAME:-idea2strategy-local}

x-spring-environment: &spring-environment
  SPRING_PROFILES_ACTIVE: local
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  AWS_ENDPOINT_URL_SQS: http://localstack:4566
  AWS_REGION: ${AWS_REGION:-ap-northeast-2}
  AWS_ACCESS_KEY_ID: ${LOCALSTACK_ACCESS_KEY:-test}
  AWS_SECRET_ACCESS_KEY: ${LOCALSTACK_SECRET_KEY:-test}
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: ${S3_REGION:-ap-northeast-2}
  S3_MARKET_DATA_BUCKET: ${S3_MARKET_DATA_BUCKET}
  S3_RESULTS_BUCKET: ${S3_RESULTS_BUCKET}

x-python-environment: &python-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  AWS_ENDPOINT_URL_SQS: http://localstack:4566
  AWS_REGION: ${AWS_REGION:-ap-northeast-2}
  AWS_ACCESS_KEY_ID: ${LOCALSTACK_ACCESS_KEY:-test}
  AWS_SECRET_ACCESS_KEY: ${LOCALSTACK_SECRET_KEY:-test}
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: ${S3_REGION:-ap-northeast-2}
  S3_MARKET_DATA_BUCKET: ${S3_MARKET_DATA_BUCKET}
  S3_RESULTS_BUCKET: ${S3_RESULTS_BUCKET}

services:
  postgres:
    container_name: idea2strategy-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [development]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    container_name: idea2strategy-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    networks: [development]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    container_name: idea2strategy-minio
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    networks: [development]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  minio-init:
    container_name: idea2strategy-minio-init
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_MARKET_DATA_BUCKET: ${S3_MARKET_DATA_BUCKET:?S3_MARKET_DATA_BUCKET is required}
      S3_RESULTS_BUCKET: ${S3_RESULTS_BUCKET:?S3_RESULTS_BUCKET is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_MARKET_DATA_BUCKET}"
        mc mb --ignore-existing "local/$${S3_RESULTS_BUCKET}"
        mc version enable "local/$${S3_MARKET_DATA_BUCKET}"
        mc version enable "local/$${S3_RESULTS_BUCKET}"
        mc anonymous set none "local/$${S3_MARKET_DATA_BUCKET}"
        mc anonymous set none "local/$${S3_RESULTS_BUCKET}"
    networks: [development]
    restart: "no"

  localstack:
    container_name: idea2strategy-localstack
    image: localstack/localstack:4.7.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-14566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/docker/localstack/ready.d:/etc/localstack/init/ready.d:ro
    networks: [development]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"running\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  flyway:
    container_name: idea2strategy-flyway
    image: redgate/flyway:11-alpine
    profiles: [apps]
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -connectRetries=60
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - -user=${POSTGRES_USER}
      - -password=${POSTGRES_PASSWORD}
      - migrate
    volumes:
      - ./.harness/local/tmp/flyway-bundle:/flyway/sql:ro
    networks: [development]
    restart: "no"

  backend-api:
    container_name: idea2strategy-backend-api
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: backend
        APP_PROJECT: apps:backend-api
        APP_OUTPUT: apps/backend-api
    environment:
      <<: *spring-environment
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    depends_on:
      flyway: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  admin-mcp:
    container_name: idea2strategy-admin-mcp
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: backend
        APP_PROJECT: apps:admin-mcp
        APP_OUTPUT: apps/admin-mcp
    environment:
      <<: *spring-environment
      SERVER_PORT: "8083"
    ports:
      - "127.0.0.1:${ADMIN_MCP_PORT:-18083}:8083"
    depends_on:
      flyway: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  backend-batch:
    container_name: idea2strategy-backend-batch
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: backend
        APP_PROJECT: apps:backend-batch
        APP_OUTPUT: apps/backend-batch
    environment: *spring-environment
    depends_on:
      flyway: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  backend-worker:
    container_name: idea2strategy-backend-worker
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: backend
        APP_PROJECT: apps:backend-worker
        APP_OUTPUT: apps/backend-worker
    environment:
      <<: *spring-environment
      # The relay is an explicit opt-in, and the worker is the process that runs it.
      # The routing map arrives as JSON rather than as separate variables because a
      # Spring map key cannot survive an environment variable name: relaxed binding
      # turns every underscore into a nesting dot, so OFFICIAL_BACKTEST_REQUESTED
      # would bind as four nested keys instead of one event type.
      SPRING_APPLICATION_JSON: >-
        {"idea2strategy":{"outbox-relay":{"enabled":true,"queues":
        {"OFFICIAL_BACKTEST_REQUESTED":"http://localstack:4566/000000000000/official-backtest-requests"}}}}
    depends_on:
      flyway: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  market-gateway:
    container_name: idea2strategy-market-gateway
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: trading-engine
        APP_PROJECT: apps:market-gateway
        APP_OUTPUT: apps/market-gateway
    environment: *spring-environment
    depends_on:
      redis: {condition: service_healthy}
    networks: [development]

  trading-worker:
    container_name: idea2strategy-trading-worker
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: trading-engine
        APP_PROJECT: apps:trading-worker
        APP_OUTPUT: apps/trading-worker
    environment: *spring-environment
    depends_on:
      flyway: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      localstack: {condition: service_healthy}
    networks: [development]

  backtest-api:
    container_name: idea2strategy-backtest-api
    profiles: [apps]
    build:
      context: ./backtest-engine
    environment: *python-environment
    ports:
      - "127.0.0.1:${BACKTEST_PORT:-18082}:8082"
    depends_on:
      flyway: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  backtest-worker:
    container_name: idea2strategy-backtest-worker
    profiles: [apps]
    build:
      context: ./backtest-engine
    command: ["backtest-worker"]
    environment: *python-environment
    depends_on:
      flyway: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

networks:
  development:
    name: idea2strategy-development

volumes:
  postgres-data:
    name: idea2strategy-postgres-data
  minio-data:
    name: idea2strategy-minio-data
  localstack-data:
    name: idea2strategy-localstack-data
