name: ${COMPOSE_PROJECT_NAME:-idea2strategy-local}

x-spring-environment: &spring-environment
  SPRING_PROFILES_ACTIVE: local
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  OPERATOR_AUTH_THROTTLE_REDIS_URI: redis://redis:6379/0
  AWS_ENDPOINT_URL_SQS: http://localstack:4566
  AWS_REGION: ${AWS_REGION:-ap-northeast-2}
  AWS_ACCESS_KEY_ID: ${LOCALSTACK_ACCESS_KEY:-test}
  AWS_SECRET_ACCESS_KEY: ${LOCALSTACK_SECRET_KEY:-test}
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: ${S3_REGION:-ap-northeast-2}
  S3_MARKET_DATA_BUCKET: ${S3_MARKET_DATA_BUCKET}
  S3_RESULTS_BUCKET: ${S3_RESULTS_BUCKET}
  # backend-api registers the customer identity surface (signup/login/token refresh)
  # only when all five keys are present (fail-closed, root #266). dev.ps1
  # generates and backfills them into .env.docker.
  IDENTITY_CRYPTO_EMAIL_ENCRYPTION_KEY: ${IDENTITY_CRYPTO_EMAIL_ENCRYPTION_KEY}
  IDENTITY_CRYPTO_LOOKUP_HMAC_KEY: ${IDENTITY_CRYPTO_LOOKUP_HMAC_KEY}
  IDENTITY_CRYPTO_VERIFICATION_HMAC_KEY: ${IDENTITY_CRYPTO_VERIFICATION_HMAC_KEY}
  IDENTITY_CRYPTO_REFRESH_TOKEN_HMAC_KEY: ${IDENTITY_CRYPTO_REFRESH_TOKEN_HMAC_KEY}
  IDENTITY_CRYPTO_CUSTOMER_JWT_SIGNING_KEY: ${IDENTITY_CRYPTO_CUSTOMER_JWT_SIGNING_KEY}
  IDENTITY_JWT_REFRESH_COOKIE_SECURE: ${IDENTITY_JWT_REFRESH_COOKIE_SECURE:-false}
  IDENTITY_OIDC_ENABLED: ${IDENTITY_OIDC_ENABLED:-false}
  IDENTITY_OIDC_PROVIDERS_GOOGLE_ISSUER: https://accounts.google.com
  IDENTITY_OIDC_PROVIDERS_GOOGLE_JWKS_URI: https://www.googleapis.com/oauth2/v3/certs
  IDENTITY_OIDC_PROVIDERS_GOOGLE_AUDIENCES_0: ${GOOGLE_OAUTH_CLIENT_ID:-disabled.apps.googleusercontent.com}
  OPERATOR_AUTH_ENABLED: ${OPERATOR_AUTH_ENABLED:-true}
  OPERATOR_AUTH_SECURE_COOKIE: "false"
  OPERATOR_AUTH_TOTP_KEY_VERSION: "1"
  OPERATOR_AUTH_TOTP_KEY: ${OPERATOR_AUTH_TOTP_KEY}
  OPERATOR_AUTH_SESSION_HMAC_KEY_VERSION: "1"
  OPERATOR_AUTH_SESSION_HMAC_KEY: ${OPERATOR_AUTH_SESSION_HMAC_KEY}
  OPERATOR_AUTH_CSRF_HMAC_KEY_VERSION: "1"
  OPERATOR_AUTH_CSRF_HMAC_KEY: ${OPERATOR_AUTH_CSRF_HMAC_KEY}
  OPERATOR_AUTH_SOURCE_HMAC_KEY_VERSION: "1"
  OPERATOR_AUTH_SOURCE_HMAC_KEY: ${OPERATOR_AUTH_SOURCE_HMAC_KEY}
  OPERATOR_AUTH_LOGIN_HMAC_KEY_VERSION: "1"
  OPERATOR_AUTH_LOGIN_HMAC_KEY: ${OPERATOR_AUTH_LOGIN_HMAC_KEY}

x-python-environment: &python-environment
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  AWS_ENDPOINT_URL_SQS: http://localstack:4566
  AWS_REGION: ${AWS_REGION:-ap-northeast-2}
  AWS_ACCESS_KEY_ID: ${LOCALSTACK_ACCESS_KEY:-test}
  AWS_SECRET_ACCESS_KEY: ${LOCALSTACK_SECRET_KEY:-test}
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION: ${S3_REGION:-ap-northeast-2}
  S3_MARKET_DATA_BUCKET: ${S3_MARKET_DATA_BUCKET}
  S3_RESULTS_BUCKET: ${S3_RESULTS_BUCKET}

x-backtest-environment: &backtest-environment
  <<: *python-environment
  BACKTEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  BACKTEST_RESULTS_BUCKET: ${S3_RESULTS_BUCKET}
  BACKTEST_RESULTS_PREFIX: backtest-results
  BACKTEST_EXECUTION_POLICY_FILE: /runtime-policy/execution-policy.json
  BACKTEST_RESULT_INGEST_TOKEN: ${BACKTEST_RESULT_INGEST_TOKEN}
  # The backend and backtest API must receive the exact same padded base64 value.
  CUSTOMER_JWT_SIGNING_KEY_BASE64: ${IDENTITY_CRYPTO_CUSTOMER_JWT_SIGNING_KEY}
  BACKTEST_RESULT_PRINCIPAL_ID: 00000000-0000-4000-8000-000000000266
  CUSTOMER_JWT_ISSUER: https://ideatostrategy.com
  CUSTOMER_JWT_ACCESS_AUDIENCE: idea2strategy-api
  AWS_ENDPOINT_URL_S3: http://minio:9000
  AWS_ENDPOINT_URL_SQS: http://localstack:4566
  # LocalStack accepts arbitrary credentials; using MinIO's credentials lets
  # the same process reach both emulators without any real AWS credential.
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

services:
  postgres:
    container_name: idea2strategy-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [development]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    container_name: idea2strategy-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    networks: [development]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    container_name: idea2strategy-minio
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    networks: [development]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  minio-init:
    container_name: idea2strategy-minio-init
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_MARKET_DATA_BUCKET: ${S3_MARKET_DATA_BUCKET:?S3_MARKET_DATA_BUCKET is required}
      S3_RESULTS_BUCKET: ${S3_RESULTS_BUCKET:?S3_RESULTS_BUCKET is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_MARKET_DATA_BUCKET}"
        mc mb --ignore-existing "local/$${S3_RESULTS_BUCKET}"
        mc version enable "local/$${S3_MARKET_DATA_BUCKET}"
        mc version enable "local/$${S3_RESULTS_BUCKET}"
        mc anonymous set none "local/$${S3_MARKET_DATA_BUCKET}"
        mc anonymous set none "local/$${S3_RESULTS_BUCKET}"
    networks: [development]
    restart: "no"

  localstack:
    container_name: idea2strategy-localstack
    image: localstack/localstack:4.7.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-northeast-2}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-14566}:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/docker/localstack/ready.d:/etc/localstack/init/ready.d:ro
    networks: [development]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"running\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  flyway:
    container_name: idea2strategy-flyway
    image: redgate/flyway:11-alpine
    profiles: [apps]
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -connectRetries=60
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - -user=${POSTGRES_USER}
      - -password=${POSTGRES_PASSWORD}
      - migrate
    volumes:
      - ./.harness/local/tmp/flyway-bundle:/flyway/sql:ro
    networks: [development]
    restart: "no"

  backend-api:
    container_name: idea2strategy-backend-api
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: backend
        APP_PROJECT: apps:backend-api
        APP_OUTPUT: apps/backend-api
    environment:
      <<: *spring-environment
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    depends_on:
      flyway: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  admin-mcp:
    container_name: idea2strategy-admin-mcp
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: backend
        APP_PROJECT: apps:admin-mcp
        APP_OUTPUT: apps/admin-mcp
    environment:
      <<: *spring-environment
      SERVER_PORT: "8083"
    ports:
      - "127.0.0.1:${ADMIN_MCP_PORT:-18083}:8083"
    depends_on:
      flyway: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  backend-batch:
    container_name: idea2strategy-backend-batch
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: backend
        APP_PROJECT: apps:backend-batch
        APP_OUTPUT: apps/backend-batch
    environment: *spring-environment
    depends_on:
      flyway: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  backend-worker:
    container_name: idea2strategy-backend-worker
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: backend
        APP_PROJECT: apps:backend-worker
        APP_OUTPUT: apps/backend-worker
    environment:
      <<: *spring-environment
      # The relay is an explicit opt-in, and the worker is the process that runs it.
      # The routing map arrives as JSON rather than as separate variables because a
      # Spring map key cannot survive an environment variable name: relaxed binding
      # turns every underscore into a nesting dot, so OFFICIAL_BACKTEST_REQUESTED
      # would bind as four nested keys instead of one event type.
      SPRING_APPLICATION_JSON: >-
        {"idea2strategy":{"outbox-relay":{"enabled":true,"queues":
        {"OFFICIAL_BACKTEST_REQUESTED":"http://localstack:4566/000000000000/backtest-basic-request",
        "CUSTOM_BACKTEST_REQUESTED":"http://localstack:4566/000000000000/backtest-custom-request",
        "COMPETITION_BACKTEST_REQUESTED":"http://localstack:4566/000000000000/backtest-competition-request"}}}}
      # The remaining relay routes stay as environment variables, which application.yaml
      # already reads. A Spring map merges by key across property sources, so these join
      # the three above rather than replacing them, and OutboxRelayConfiguration skips any
      # route whose URL is blank -- which is exactly how these sat unnoticed until now.
      ROOM_LEDGER_OPEN_REQUEST_QUEUE_URL: http://localstack:4566/000000000000/room-ledger-open-request
      ROOM_LEDGER_OPENED_QUEUE_URL: http://localstack:4566/000000000000/room-ledger-opened
      ROOM_LEDGER_REJECTED_QUEUE_URL: http://localstack:4566/000000000000/room-ledger-rejected
      CORPORATE_ACTION_APPROVAL_QUEUE_URL: http://localstack:4566/000000000000/corporate-action-approval
      # The result consumer applies the ledger outcome back onto the room. It refuses to
      # start unless both result URLs are present, so the two go together with this flag.
      ROOM_LEDGER_RESULT_CONSUMER_ENABLED: "true"
    depends_on:
      flyway: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  market-gateway:
    container_name: idea2strategy-market-gateway
    profiles: [market-live]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: trading-engine
        APP_PROJECT: apps:market-gateway
        APP_OUTPUT: apps/market-gateway
    environment:
      <<: *spring-environment
      # The Alpaca -> Redis publishing path activates only when redis-uri is set
      # (MarketGatewayConfiguration is @ConditionalOnProperty on it), and then fails
      # closed without credentials, the instrument mapping, and rights evidence. With
      # none of this the gateway started and published nothing, so the worker below had
      # an empty stream to consume and no bot could ever evaluate locally. These mirror
      # the AWS host values in
      # infra/terraform/environments/development/templates/ec2-user-data.sh.tftpl:568-576,
      # with plain redis:// because the local broker has no TLS.
      MARKET_GATEWAY_REDIS_URI: redis://redis:6379
      MARKET_GATEWAY_REDIS_KEY_PREFIX: ${MARKET_EVENT_KEY_PREFIX:-i2s}
      MARKET_GATEWAY_ALPACA_FEED: ${ALPACA_FEED:-sip}
      MARKET_GATEWAY_MINIMUM_INSTRUMENT_COUNT: "500"
      MARKET_GATEWAY_INSTRUMENT_MAPPING_PATH: /etc/market-gateway/instruments.json
      MARKET_GATEWAY_RIGHTS_EVIDENCE_PATH: /etc/market-gateway/alpaca-sip-rights.json
      MARKET_GATEWAY_MATERIALIZATION_RECEIPT_PATH: /etc/market-gateway/materialization.properties
      # Credentials come from .env.docker and are never committed. Without them the
      # gateway refuses to start, which is the intended posture.
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
    volumes:
      # scripts/prepare-local-market-gateway.ps1 writes these three, the local
      # counterpart of what development-database-bootstrap.sh materializes for AWS. The
      # receipt records each file's SHA-256 against the container path, so the mount
      # point has to match MARKET_GATEWAY_*_PATH above exactly.
      - ./.harness/local/market-gateway:/etc/market-gateway:ro
    depends_on:
      redis: {condition: service_healthy}
    networks: [development]

  trading-worker:
    container_name: idea2strategy-trading-worker
    profiles: [apps]
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile.spring
      args:
        SERVICE_DIR: trading-engine
        APP_PROJECT: apps:trading-worker
        APP_OUTPUT: apps/trading-worker
    environment:
      <<: *spring-environment
      # MarketEventTransportConfiguration is @ConditionalOnProperty on
      # trading.market-events.redis-uri with no matchIfMissing, so without this the
      # transport bean is never created: the worker started cleanly and consumed zero
      # market events, which meant no evaluation, no order candidates and no fills. That
      # is why INT03 never passed locally. AWS sets these at
      # templates/ec2-user-data.sh.tftpl:578-580; the prefix must match the gateway's.
      TRADING_MARKET_EVENTS_REDIS_URI: redis://redis:6379
      TRADING_MARKET_EVENTS_REDIS_KEY_PREFIX: ${MARKET_EVENT_KEY_PREFIX:-i2s}
      TRADING_MARKET_EVENTS_CONSUMER_NAME: ${TRADING_CONSUMER_NAME:-trading-worker-local-1}
      # Opens the ledger account a room participant needs. The poller reads pending
      # requests from the shared outbox table rather than from a queue, so this flag is
      # all it needs; the results it writes are relayed by backend-worker above.
      TRADING_ROOM_ACCOUNT_OPEN_ENABLED: "true"
    depends_on:
      flyway: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      localstack: {condition: service_healthy}
    networks: [development]

  backtest-api:
    container_name: idea2strategy-backtest-api
    profiles: [apps]
    build:
      context: ./backtest-engine
    environment:
      <<: *backtest-environment
      BACKTEST_API_HOST: 0.0.0.0
      BACKTEST_API_PORT: "8082"
      BACKTEST_AUTHENTICATOR: backtest_engine.production:api_authenticator
      BACKTEST_OBJECT_STORE: backtest_engine.production:s3_object_store
      BACKTEST_OWNER_DIRECTORY: backtest_engine.production:postgres_owner_directory
      BACKTEST_COMPILED_PLAN_SOURCE: backtest_engine.production:postgres_compiled_plan_source
      BACKTEST_DATASET_MANIFEST_SOURCE: backtest_engine.production:postgres_dataset_manifest_source
      BACKTEST_EXECUTION_POLICY_CATALOG: backtest_engine.production:execution_policy_catalog
      BACKTEST_DEAD_LETTER_SINK: backtest_engine.production:sqs_dead_letter_sink
      BACKTEST_QUEUE_URL: http://localstack:4566/000000000000/backtest-basic
      BACKTEST_API_DLQ_URL: http://localstack:4566/000000000000/backtest-basic-dlq
    volumes:
      - ./proposals/development-runtime-policy/artifacts:/runtime-policy:ro
    ports:
      - "127.0.0.1:${BACKTEST_PORT:-18082}:8082"
    depends_on:
      flyway: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

  backtest-worker:
    container_name: idea2strategy-backtest-worker
    profiles: [apps]
    build:
      context: ./backtest-engine
    command: ["backtest-worker"]
    environment:
      <<: *backtest-environment
      BACKTEST_JOB_HANDLER: backtest_engine.production:orchestrator_job_handler
      BACKTEST_EXECUTION_KEY_STORE: backtest_engine.production:postgres_execution_key_store
      BACKTEST_REQUEST_HANDLER: backtest_engine.production:backtest_request_handler
      BACKTEST_REQUEST_RECEIPT_STORE: backtest_engine.production:postgres_request_receipt_store
      BACKTEST_WORKER_ID: local-backtest-worker
      BACKTEST_WORKER_CORRELATION_ID: 00000000-0000-4000-8000-000000000082
      BACKTEST_BASIC_QUEUE_URL: http://localstack:4566/000000000000/backtest-basic
      BACKTEST_BASIC_DLQ_URL: http://localstack:4566/000000000000/backtest-basic-dlq
      BACKTEST_BASIC_MAX_CONCURRENCY: "2"
      BACKTEST_CUSTOM_QUEUE_URL: http://localstack:4566/000000000000/backtest-custom
      BACKTEST_CUSTOM_DLQ_URL: http://localstack:4566/000000000000/backtest-custom-dlq
      BACKTEST_CUSTOM_MAX_CONCURRENCY: "1"
      BACKTEST_COMPETITION_QUEUE_URL: http://localstack:4566/000000000000/backtest-competition
      BACKTEST_COMPETITION_DLQ_URL: http://localstack:4566/000000000000/backtest-competition-dlq
      BACKTEST_COMPETITION_MAX_CONCURRENCY: "1"
      BACKTEST_MAX_TOTAL_CONCURRENCY: "4"
      BACKTEST_BASIC_REQUEST_QUEUE_URL: http://localstack:4566/000000000000/backtest-basic-request
      BACKTEST_BASIC_REQUEST_DLQ_URL: http://localstack:4566/000000000000/backtest-basic-request-dlq
      BACKTEST_CUSTOM_REQUEST_QUEUE_URL: http://localstack:4566/000000000000/backtest-custom-request
      BACKTEST_CUSTOM_REQUEST_DLQ_URL: http://localstack:4566/000000000000/backtest-custom-request-dlq
      BACKTEST_COMPETITION_REQUEST_QUEUE_URL: http://localstack:4566/000000000000/backtest-competition-request
      BACKTEST_COMPETITION_REQUEST_DLQ_URL: http://localstack:4566/000000000000/backtest-competition-request-dlq
      BACKTEST_MARKET_DATA_BUCKET: ${S3_MARKET_DATA_BUCKET}
      BACKTEST_MARKET_DATA_CACHE: /tmp/idea2strategy-market-data
      BACKTEST_MARKET_DATA_BATCH_SIZE: "65536"
      BACKTEST_API_BASE_URL: http://backtest-api:8082
      BACKTEST_RUNTIME_POLICY_FILE: /runtime-policy/runtime-policy.json
    volumes:
      - ./proposals/development-runtime-policy/artifacts:/runtime-policy:ro
    depends_on:
      flyway: {condition: service_completed_successfully}
      backtest-api: {condition: service_started}
      minio-init: {condition: service_completed_successfully}
      localstack: {condition: service_healthy}
    networks: [development]

networks:
  development:
    name: idea2strategy-development

volumes:
  postgres-data:
    name: idea2strategy-postgres-data
  minio-data:
    name: idea2strategy-minio-data
  localstack-data:
    name: idea2strategy-localstack-data
