schema_version: 1
id: work.strategy-release-automatic-backtest-example
readiness: draft
title: Release one immutable strategy and enqueue its official automatic backtest
outcome: A validated strategy document is released as an immutable server-owned snapshot and exactly one official automatic backtest is requested through a versioned provider-consumer contract.
acceptance:
    - id: acceptance.strategy.release-immutable
      given: An authenticated owner has a server-validated Basic or Pro strategy document with every required policy explicitly selected.
      when: The owner requests release, including a retry of the same request.
      then: One immutable release snapshot and one transactional outbox message are committed, and later mutation of the released meaning is rejected.
      failure: A draft starts execution, a released snapshot can be edited, a hidden policy default is applied, or a retry creates another release.
    - id: acceptance.backtest.official-once
      given: The versioned release event identifies an immutable strategy snapshot and the official backtest assumptions.
      when: The backtest consumer receives the event one or more times.
      then: Exactly one official backtest run is linked to that released snapshot and records an explicit runnable, unavailable, completed, or failed result.
      failure: Delivery retry creates another official run, required market resolution is approximated, or the selected dataset changes silently.
refs:
    - capability.backtest.automatic
    - journey.strategy.author
    - policy.execution.server-only
    - policy.strategy.immutable-release
    - quality.auditability
    - quality.failure-safety
    - quality.reproducibility
    - scenario.strategy.release
workspaces:
    - workspace.backend
    - workspace.backtest-engine
    - workspace.root
scope:
    repositories:
        - repository.github.root
    paths:
        - backend
        - backtest-engine
    policy_ids:
        - policy.execution.server-only
        - policy.strategy.immutable-release
    scenario_ids:
        - scenario.strategy.release
    contract_ids: []
    db_entities:
        - strategy.strategies
        - strategy.strategy_documents
        - strategy.compiled_flow_plans
        - operations.outbox_messages
        - backtest.runs
        - backtest.run_attempts
    migration_slots:
        - postgresql.strategy-release-and-backtest
    ui_flows:
        - ui.strategy.authoring
        - ui.backtest.results
    dependency_majors: []
    root_pointers:
        - workspace.backend
        - workspace.backtest-engine
dependencies:
    - work.dbml-business-alignment
merge_order:
    - workspace.backend
    - workspace.backtest-engine
    - workspace.root
first_failing_test: Releasing the same validated strategy twice must fail until one immutable release and exactly one official backtest request are guaranteed across transaction retry and repeated message delivery.
evidence:
    kinds:
        - contract-test
        - database-integration-test
        - idempotency-test
        - repository-integrity
        - service-integration-test
    integration_required: true
    user_validation: true
    migration_required: true
    rollback_required: true
